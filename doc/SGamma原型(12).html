<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SGamma MQ 检测编辑页原型 1920×1040</title>
<style>
:root{
  /* ---- 尺寸尺：sN = N × 4。给结构尺寸（栏宽 / 条高 / 控件宽 / 方盒）
         用，间距不走这把尺子，走下面的 --sp* 四档 ---- */
  --s0:2px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:28px; --s8:32px; --s9:36px; --s10:40px; --s11:44px; --s12:48px; --s13:52px; --s14:56px; --s15:60px; --s16:64px; --s17:68px; --s18:72px; --s19:76px; --s20:80px;

  /* ---- 间距（规范 §3）：不用另起一套令牌，仍走上面这把尺子，但只有四档可用 ——
         margin / padding / gap 只允许 --s1(4) --s2(8) --s4(16) --s6(24)，
         禁止第五档。栅格水槽例外，可用 8/16/24/32/40，经验上 24 最佳。
         这条由「原型一致性校验」按属性检查，不靠人记。 ---- */

  /* ---- 字号（规范 §2）：正文档 14px 一档，层级由字重与颜色承担；
         展示级两档只给大数字读数，不计入层级。
         图标尺寸另起一套，只 16 / 20 / 24（规范 §十六）。 ---- */
  --fs:14px;
  --fs-d1:24px; --fs-d2:32px;
  --ic-s:16px;  --ic:20px;  --ic-l:24px;

  /* ---- 字重三档（规范 §2.1，与字号叠加） ---- */
  --w:400; --w-m:500; --w-b:600;

  /* ---- 行高：比例制，样式表里不得出现写死的像素行高（规范 §2.3、§十七） ---- */
  --lh:1.4; --lh-t:1.15;

  /* ---- 圆角四档（规范 §十六）：2 密排表格单元与小徽标 / 4 控件
         / 6 浮层与按钮 / 10 卡片与弹窗 ---- */
  --r-s:2px; --r:4px; --r-l:6px; --r-xl:10px;

  /* ---- 投影三级（规范 §十六：只用卡片、浮动窗、弹窗三级）。
         级 2 的透明度高于级 3 是有意的：它唯一的使用者浮在检测图像上，
         背景不可控，跟浮在白底上的菜单不是一回事，属记录在案的偏离。 ---- */
  --sh1:0 1px 3px rgba(15,23,42,.24);
  --sh2:0 4px 14px rgba(15,23,42,.28);
  --sh3:0 10px 26px rgba(15,23,42,.16);
  --sh4:0 24px 60px rgba(15,23,42,.32);

  /* ---- 骨架（规范 §19 跨产品共用令牌表）：外壳三条尺寸的唯一来源。
         所有覆盖层一律引用它们定位，不得自己写死左边距或底边距。 ---- */
  --h-global:40px;   /* 全局条：标题条 */
  --h-navbar:68px;   /* 工具条：当前页面的工具与常驻控制 */
  --h-head:40px;     /* 面板头：树头 / 属性栏头 / 主视区标题行 / 弹窗标题栏 */
  --h-act:36px;      /* 功能行：面板头下面那条放按钮/筛选的行 */
  --h-row:32px;      /* 列表行：树节点 / 表格行 / 表头 / 属性行 */
  --h-status:36px;   /* 状态栏：页面最底那一条 */
  --h-ctrl:32px;     /* 控件默认高 */
  --rail-box:64px;   /* 导航方盒边长；栏宽 = 方框 + 8 */
  --header-h:calc(var(--h-global) + var(--h-navbar));
  --rail-w:calc(var(--rail-box) + 8px);
  --status-h:var(--h-status);

  /* ---- 栏宽（结构树 / 节点栏或工具箱 / 属性栏）。
         对齐量写成 calc 引用，改栏宽时自动跟上，不留一改就忘的魔数。 ---- */
  --w-tree:280px; --w-node:280px; --w-prop:320px;

  /* ---- 色板（规范 §1）：中性色一支（~225° 冷偏），强调色一支，语义色三支。
         规则：CSS 里不得出现颜色字面量，全部走令牌。 ---- */
  --white:#FFFFFF;
  --canvas:#F8FAFC; --panel:#F1F5F9; --sunk:#E2E8F0;
  --line-soft:#F1F5F9; --line:#E2E8F0; --line-strong:#CBD5E1;
  --t1:#0F172A; --t2:#334155; --t3:#64748B; --t4:#94A3B8; --dis:#94A3B8;
  --ink:#0F172A;   /* 深底：只用于图像画布（相机取景/回放） */

  /* 导航栏不再单起一套颜色（原 --nav-a/--nav-b/--nav-hi/--nav-sel/--nav-t1/--nav-t2/--nav-line
     一族已删）：它是浅色主题的一部分，底色走 --panel、悬停走 --panel、选中走 --acc、
     分隔线走 --line、文字走 --t2，全是全局色。留着同值别名只会多一个漂移点。 */

  /* 强调色配额：带饱和度的像素只给被测物与判定，
     导航/页签/选中态一律中性底 + 3px 强调条。
     --acc 实心填充只留给主操作按钮、勾选与开关、焦点环、拖拽辅助线。 */
  --acc:#2563EB; --acc-t:#1D4ED8; --acc-bg:#EFF6FF;
  --sel:#EFF6FF; --sel-hi:#F1F5F9;   /* 中性选中 / 悬停，取代到处铺的 --acc-bg */
  --acc-line:#1D4ED8; --acc-soft:#EFF6FF; --acc-mid:#2563EB;

  /* 语义色三支：每支五个端口 · 文字 / 浅底 / 描边 / 实心 / 加深 */
  --ok:#047857; --ok-bg:#ECFDF5; --ok-line:#047857; --ok-mid:#059669;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#B45309; --warn-mid:#F59E0B;
  --err:#B91C1C; --err-bg:#FEF2F2; --err-line:#B91C1C; --err-mid:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0}body{font-size:var(--fs);color:var(--t1);display:flex;justify-content:flex-start;min-height:100vh;padding:0;align-items:flex-start;background:var(--t3);overflow:auto;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}#wrap{overflow:hidden;flex:none;border:0;box-shadow:var(--sh4)}
/* 舞台 1920×1040（用户 2026-09-29：窗口最大化、任务栏常驻），少的 40px 由内容区吸收 */
#stage{width:1920px;height:1040px;transform-origin:top left;background:var(--white);
  display:flex;flex-direction:column;overflow:hidden;position:relative}i.ti{display:inline-flex;align-items:center;justify-content:center;font-style:normal;line-height:1;flex:none;font-size:var(--ic-s)}
/* 画布标注：编号徽章常驻，文字标签按需浮出。
   .on 是异常项（默认展开），其余靠悬停——键鼠环境下 hover 是成立的交互，
   已跟用户确认过这台工控机是键鼠不是触摸屏。 */
.ann .alb{opacity:0;transition:opacity .12s}
.ann:hover .alb,.ann.on .alb{opacity:1}
.ann{cursor:default}svg.icn{width:1em;height:1em;display:block;fill:currentColor;stroke:none}
.hide{display:none!important}

/* ---------- 骨架 ----------
   左栏贯通全高（logo 在它顶上），右侧是工作区（标题栏 + 顶栏 + 内容）。
   logo 必须在左栏里面，否则它和导航是两个元素各画一段渐变，接缝处一定对不上。 */
#shell{flex:1;display:flex;min-height:0}#workarea{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}#header{display:flex;flex-direction:column;flex:none}
/* logo 现在是左栏的第一段，背景交给 #rail 的渐变，自己不画底色也不画边框 */
#logo{width:100%;flex:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s1);padding:var(--s3) 0 var(--s4)}#logomark{width:var(--s12);height:var(--s12);flex:none;border-radius:var(--r-l);background:rgba(15,23,42,.03);border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:var(--fs)}#logotext .n{color:var(--t1);font-size:var(--fs);letter-spacing:.3px;text-align:center}#logotext .v{color:var(--t3);font-size:var(--fs);text-align:center}#tabbar{height:var(--h-global);flex:none;display:flex;align-items:center;gap:var(--s1);background:var(--panel);border-bottom:1px solid var(--line);padding:0 var(--s4)}#projname{color:var(--t3);font-size:var(--fs);white-space:nowrap}#wbtns{display:flex;align-items:center;gap:var(--s1);margin-left:auto}.wbtn{height:var(--s7);display:flex;align-items:center;justify-content:center;border-radius:var(--r-s);color:var(--t2);cursor:pointer;font-size:var(--ic-s);width:var(--s12)}
.wbtn:hover{background:var(--line)}
.wbtn.close:hover{background:var(--err);color:var(--white)}
/* 保存/执行三键放在导航栏最右侧，跟导航项同一条栏、同一个骨架（图标在上文字在下），
   盒子尺寸也完全一致，不因为「连续执行」四个字就变宽。
   #rgroups/#prodhead（各页自己的工具、生产头）留在左侧 #rail 不动：一个是常驻不变的
   全局动作，一个是随页面变化的内容，两类东西不混在一处 */
#navbar #pinned{display:flex;align-items:center;gap:var(--s1);margin-left:auto}
#navbar #runbtns{display:flex;align-items:center;gap:var(--s1)}
#navbar .rsep{width:1px;height:var(--s10);flex:none;background:var(--line);align-self:center;margin:0 var(--s1)}
#navbar .rbtn{width:var(--s15);height:var(--s15);min-width:0;padding:0;border-radius:var(--r);gap:var(--s1)}
#navbar .rbtn[data-dbg="loop"]{width:auto;min-width:var(--s15);padding:0 var(--s2)}
/* 生产控制是整机开关，不是普通工具按钮——宽度做成标准按钮的两倍，
   用尺寸本身把它跟旁边一排等宽的东西区分开。写成 calc 而不是 120px，
   是让「两倍」这个意图留在代码里，将来标准按钮改了它自己会跟着走。 */
/* 只有「开始生产 / 停止生产」这两个整机开关做双倍宽；
   复位是就地清报警，属于普通动作，保持标准宽度。 */
#navbar #runbtns .rbtn[data-dbg="loop"],
#navbar #runbtns .rbtn[data-dbg="stop"]{width:calc(var(--s15)*2)}
/* §81 这里原有三条 `#navbar .rbtn.pri{...}`，随连续执行改回普通样式一并删除。
   删的时候用的正则从 `.rbtn.pri` 起匹配，把 `#navbar ` 前缀留在了原地，
   三个孤儿选择器跟下面真正的 #navbar 规则连成了一条，导致 #navbar 失去
   display:flex，三个子项竖着堆成三行。已修复，并补了断言盯住这一类事故。 */
#rextra{display:flex;align-items:center;gap:var(--s4);flex:none;margin-left:var(--s4)}#navbar{height:var(--h-navbar);flex:none;display:flex;align-items:center;background:var(--white);border-bottom:1px solid var(--line);gap:var(--s2);padding:var(--s1) var(--s4);position:relative}
#navbar.hide{display:none}
/* SGamma 专有：工具箱是画布右侧一栏（用户 2026-10-08），按组折叠的竖列表 */
#tbpane{width:var(--w-prop);flex:none;border-left:1px solid var(--line);background:var(--white);display:flex;flex-direction:column}
#tbpane.hide{display:none}
#tbhead{flex:none;display:flex;align-items:center;height:var(--h-head);padding:0 var(--s2) 0 var(--s4);background:var(--panel);border-bottom:1px solid var(--line);color:var(--t1);gap:var(--s2);font-size:var(--fs)}
#tbhead .nm{flex:1}
#tbhead .ti{font-size:var(--ic-s);color:var(--t3);cursor:pointer}
#tbhead .ti:hover{color:var(--t1)}

/* 原来 ribbon 那一整条（工具组 #rgroups、生产头 #prodhead、常驻的保存/执行 #pinned）
   现在跟这次一起搬去左侧 #rail 了，不再是横排在顶部的第二条——这次连"工具条"本身也搬走，
   不只是保存/执行，所以 ribbon 这条横条彻底不需要了：不会再有任何页面在顶部留出一条
   工具条却是空的，"设备配置/机台结构头部空白突兀"这个问题不是靠遮一遮解决的，
   是从根上不再有这条横条。logo 固定 120px 高、顶部现在只剩 44px 的导航条，
   两者对不上会露一块空白——跟用户确认过，先接受这个视觉差，不为了填满它牺牲 logo。 */
/* 组名（rgroup / .rname）已撤。原因是几何上装不下：
     .rbtn = 4 + 26(图标) + 4 + 18(文字) + 4 = 56，加 gap 4 加组名 16 = 76，
     而工具条 68 减上下内边距只剩 60 —— 差 16px，组名一直被下边框切掉。
   缩图标救不了（26→16 只省 10），加高工具条又跟 Arco「顶部导航不宜过高」和
   「68 对齐导航栏按钮尺寸」两条冲突。
   而且组名本来就在重复旁边的按钮：「本地图像」这个组名边上就站着一个选中的
   「本地图像」按钮——跟已定的「两个来源按钮不挂组名」是同一条逻辑。
   分组改用竖分割线 .rsep 表达，不用文字。 */
#rgroups{display:flex;align-items:center;gap:var(--s4);flex:none}
.rrow{display:flex;gap:var(--s1);align-items:center}
.rbtn{min-width:var(--s14);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s1);padding:var(--s1) var(--s2);border-radius:var(--r);cursor:pointer;user-select:none;white-space:nowrap}
.rbtn:hover{background:var(--panel)}
.rbtn .ti{font-size:var(--ic-l);color:var(--t2)}
.rbtn span{font-size:var(--fs);color:var(--t2);display:flex;align-items:center;gap:var(--s1);white-space:nowrap}
.rbtn span .ti{font-size:var(--ic-s)}
.rbtn.on{background:var(--sel)}#nodeacts{justify-content:flex-start;height:var(--s9);flex:none;display:flex;align-items:center;
  gap:var(--s1);padding:0 var(--s2);background:var(--white);
  border-bottom:1px solid var(--line)}
#nodeacts .tfb{width:auto;height:var(--s8);padding:0 var(--s2);gap:var(--s1);flex:none}
#nodeacts .tfb .cv{flex:none}
#nodeacts.hide{display:none}#crun{display:flex;align-items:center;gap:var(--s2);flex:none;margin-right:var(--s4)}
#crun .crbtn{display:flex;align-items:center;justify-content:center;gap:var(--s1);
  height:var(--s8);padding:0 var(--s3);border-radius:var(--r-s);cursor:pointer;
  font-size:var(--fs);color:var(--t2);white-space:nowrap;user-select:none}
#crun .crbtn:hover{background:var(--sel-hi);color:var(--t1)}
#crun .crbtn[data-dbg="once"]{min-width:96px;background:var(--acc);color:var(--white);font-weight:var(--w-m)}
#crun .crbtn[data-dbg="once"]:hover{background:var(--acc-t)}
#crun .crbtn[data-dbg="once"] .ti{color:var(--white)}
#crun .crbtn[data-dbg="once"] span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#crun .crbtn.on{background:var(--sel);color:var(--acc-t)}
#crun .crsep{width:1px;height:var(--s4);background:var(--line);flex:none;margin:0 var(--s1)}
#crun .crbtn.dis{opacity:.45;cursor:default}
#crun .crbtn.dis:hover{background:var(--acc)}
#crun .ti{font-size:var(--ic-s)}
#cacts:not(:empty)::before{content:'';width:1px;height:var(--s4);
  background:var(--line);flex:none;margin-right:var(--s2)}
.rbtn.on .ti,.rbtn.on span{color:var(--acc-t)}
.rsep{width:1px;height:var(--s10);flex:none;background:var(--line);align-self:center;margin:0}
.rbtn.dis{opacity:.42;cursor:not-allowed}
.rbtn.dis:hover{background:none}
.rbtn.warn.on{background:var(--warn-line)}
.rbtn.warn.on .ti,.rbtn.warn.on span{color:var(--warn)}
/* 88px 窄栏放不下横排的两段式切换，改竖排；标签也放宽换行——挤到多字标签
   （比如"缺陷热力图"）时用换行兜底，而不是硬挤单行溢出。具体挤不挤需要看真机截图，
   jsdom 判断不了排版。 */
/* .rseg（在线/离线的胶囊切换）这一套已经没人用了：在线/离线改成跟其它按钮同款的
   两个 .rbtn，互斥靠 .on 表达。整组样式一起删掉，不留孤儿 CSS。 */
/* §86 执行选项菜单：整套下拉复用结构树筛选那一套（.camdd/.camop/.cbx），
   这里只补一个定位壳，不另造一套菜单样式。 */
/* §88 工位固有动作的启用开关。停用后地址仍在，只是禁用——再启用时不必重填。 */
.hsen{margin-left:auto;display:inline-flex;align-items:center;gap:var(--s2);cursor:pointer;font-weight:var(--w)}
.hsen .swtx{font-size:var(--fs);color:var(--t2)}
.fgrid.hsoff{opacity:.5}
.ropt{position:relative}
.ropt .camdd{left:0;right:auto;min-width:320px;top:calc(100% + var(--s1))}
/* 菜单展开中：用中性灰，不用 var(--sel)。工具条上的蓝底已经被「当前是哪个图像源」
   占着了，再拿它表示「菜单开着」或「有勾选项」，同一个颜色就要说三件事。 */
.ropt .rbtn.open{background:var(--panel)}
/* 「有选项启用」改用图标角标点。图标必须包在 div 里不能包 span——
   .rbtn span .ti{font-size:var(--ic-s)} 比 .rbtn .ti 更具体，包成 span 会把图标缩到 11px。 */
.ropt .roptic{position:relative;display:flex}
.ropt .rdot{position:absolute;right:calc(var(--s0) * -1);top:0;
  width:calc(var(--s0) * 3);height:calc(var(--s0) * 3);border-radius:50%;background:var(--acc)}
/* 勾选行补行级底色。筛选菜单不加这条：那里可以同时勾中十几个工位，整片蓝会糊成一块；
   执行选项只有两行，行级反馈才看得见。密度不同，结论就不同。 */
.ropt .camop.on{background:var(--sel);color:var(--acc-t)}
#runbtns .rbtn.dis{opacity:.4;cursor:not-allowed;background:none}
#runbtns .rbtn.dis .ti,#runbtns .rbtn.dis span{color:var(--dis)}#prodhead{display:none;align-items:center;gap:var(--s1);flex:none}

/* ---------- body ---------- */
#body{flex:1;display:flex;min-height:0}#rail{width:var(--rail-w);flex:none;padding:var(--s1) 0;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:var(--s2);border-right:1px solid var(--line)}
/* 底部的保存/设置/角色跟工具按钮统一：同样 64×64、同样图标字号。
   原来是 72×72 + 另一个图标字号，跟旁边的工具按钮两个尺寸，同一条栏里看着就是没对齐。
   .railline 是保存与设置之间的分割线：上面是「对当前工程的操作」，
   下面是「跟工程无关的系统入口」，两类东西要断开。 */
/* 保存吃掉中间的剩余空间，于是它正好落在底部那条分割线上方；
   底部一撮紧跟其后，不再自己 margin-top:auto（两个都 auto 会平分空隙）。 */
/* 贴底的责任放在 #railbottom 上，它永远存在；保存按钮只管自己显不显示。
   原来 margin-top:auto 挂在 #btn-save 上，生产页把保存收掉之后锚点也没了，
   设置/操作员就跟着浮到导航按钮下面去了——这是「布局职责挂在会消失的元素上」。 */
#railbottom{margin-top:auto;width:100%;display:flex;flex-direction:column;
  gap:var(--s2);align-items:center}

.pill::before{content:'';width:var(--s2);height:var(--s2);border-radius:50%;background:currentColor;flex:none}
svg.icn.ln{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ==== 共用框架层 · 工具类 BEGIN ==== */
/* =====================================================================
   L3 工具类
   用途：把「只表达一件事」的行内样式收进样式表。命名用语义角色
        （.muted / .danger），**不用令牌名**（不写 .t3 这种）；
        间距档位是唯一例外 —— 它没有语义名，用尺子序号 .mt1 = --s1。
   约束：这里只放「一个类做一件事」的原子类。要表达两件以上的组合语义，
        应当另起一个有名字的组件，不要在这里堆组合。
   两个原型**逐字共用**这一块，由 工具/原型统一/共用框架层同步.mjs 注入。
   ===================================================================== */
/* 显隐与排列 */
/* 上轮剪掉的又回来了 —— 当时它们确实没被任何元素用到，是这轮要转换的写法需要它们。
   工具类该跟着「实际在用的写法」长，先剪后加是正常迭代，不是反复。 */
.u-hide{display:none}
.u-sep{width:1px;height:var(--s5);background:var(--line)}
.u-line{height:1px;background:var(--line-soft)}
.u-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.u-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.u-box{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.u-pri{background:var(--acc);border-color:var(--acc);color:var(--white)}
.u-round{border-radius:50%}
.u-w400{font-weight:400}
.u-tabnum{font-variant-numeric:tabular-nums}
.u-accent{color:var(--acc-t)!important}
/* 刻意**不带 !important**：这两个原型都用 style.display 在运行时显隐（标记里只是初始态）。
   带 !important 会把 JS 设的行内样式压死 —— 元素再也显示不出来。
   实测：SMotorse 的 #stephead / #steplist / #toolpane 会被永久隐藏。 */
.u-row{display:flex;align-items:center;gap:var(--s2)}
.u-row4{display:flex;align-items:center;gap:var(--s1)}
.u-push{margin-left:auto}
.u-right{text-align:right}
.u-click{cursor:pointer}

/* 文字角色（语义色阶，不是令牌名） */
/* 文字色工具类带 !important：它们是终态视觉，换掉行内样式后不该被后出现的规则盖掉
   （实测：.v{color:var(--t1)} 盖过 .u-danger，把一处报错色变成了正文色）。
   注意 .u-hide 是例外 —— 它必须不带 !important，否则会压死 JS 设的行内 display。 */
.u-plain{color:var(--t2)!important}
.u-muted{color:var(--t3)!important}
.u-off{color:var(--dis)!important}
.u-ok{color:var(--ok)!important}
.u-warn{color:var(--warn)!important}
.u-danger{color:var(--err)!important}

/* 上轮剪掉的又回来了 —— 当时它们确实没被用到，是这轮要转换的写法需要它们。
   教训：工具类该跟着「实际在用的写法」长，先剪后加是正常的迭代，不是反复。 */

.u-fs-s{font-size:var(--ic-s)}
/* 间距（无语义名，用尺子序号：1=4px 2=8px 4=16px） */
.u-mt1{margin-top:var(--s1)} .u-mt2{margin-top:var(--s2)} .u-mt4{margin-top:var(--s4)} .u-mb2{margin-bottom:var(--s2)} .u-mb4{margin-bottom:var(--s4)} .u-ml2{margin-left:var(--s2)}

/* 零值长写：简写展开（margin:16px 0 8px）会拆出它们，不能省 —— 0 与「未设置」在层叠里不是一回事 */
.u-mt0{margin-top:0} .u-mr0{margin-right:0} .u-mb0{margin-bottom:0} .u-ml0{margin-left:0}
.u-pt0{padding-top:0} .u-pr0{padding-right:0} .u-pb0{padding-bottom:0} .u-pl0{padding-left:0}
/* 字号档位显式化（值等于继承的正文档，写出来是为了让组合类能匹配上） */
.u-fs{font-size:var(--fs)}

/* 选中态：实心底 + 同色描边 + 白字 */
.u-strong{color:var(--t1)!important}
.u-faint{color:var(--t4)!important}
/* 布局原子类。注意：width / height / left / top / max-width 这类**不给工具类** ——
   它们是数据不是样式（条形图宽度是 76px 还是 90px 取决于数据），留在行内才对。 */
.u-flex{display:flex}
.u-col{display:flex;flex-direction:column}
.u-align{align-items:center}
.u-mid{justify-content:center}
.u-nowrap{white-space:nowrap}
.u-flex1{flex:1}
.u-grow{flex:1 1 auto;min-width:0}
.u-gap1{gap:var(--s1)} .u-gap2{gap:var(--s2)} .u-gap4{gap:var(--s4)} .u-gap6{gap:var(--s6)}
/* 内衬与边线：为「整条 style 全是纯样式」的那 35 处补的（第 33 轮分类查出来的）。
   这几个是通用档位，不是一次性特例。 */
.u-p0{padding:0} .u-p2{padding:var(--s2)} .u-p4{padding:var(--s4)} .u-p10{padding:var(--s10)}
.u-pv1{padding:var(--s1) 0} .u-p4t{padding:var(--s4) var(--s4) 0} .u-p4b{padding:0 0 var(--s4)}
.u-m0{margin:0}
.u-lh{line-height:var(--lh)}
.u-bb{border-bottom:1px solid var(--line)} .u-bt{border-top:1px solid var(--line)}
/* 卡片：白底 + 描边 + 圆角 + 内衬。四个声明各司其职，合起来才是一张卡片，所以给个名字。 */
.u-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s4)}
/* 常见小件 */
/* ==== 共用框架层 · 工具类 END ==== */

/* 工位层内容区：采图参数｜图像 两个页签（用户 2026-10-13） */
#ctitle.ctabsh{align-self:stretch;display:flex;margin-left:calc(var(--s4)*-1)}
#ctitle.ctabsh .ptab{flex:none;padding:0 var(--s4)}
#ctitle.ctabsh .ptab.dis{color:var(--dis);cursor:not-allowed;background:none}
.ctview{flex:1;min-height:0;display:flex;flex-direction:column}
.ctview .lbar.ctbar{padding:var(--s2) var(--s4);margin:0;gap:var(--s1);border-bottom:1px solid var(--line)}
.ctview .ctw{flex:1;min-height:0;overflow:auto;padding:var(--s3) var(--s4) var(--s4)}
.ltab.wfst.ctab th:nth-child(n){width:auto}.ltab.wfst.ctab th.num{width:var(--s12)}.ltab.wfst.ctab th.nmc{width:240px}.ltab.wfst.ctab th.cmc{width:120px}.ltab.wfst.ctab th.slc{width:var(--s12)}
.ltab.ctab th{position:sticky;top:0;z-index:1}
.ltab.ctab tr[data-crow]{cursor:pointer}
.ltab.ctab tr.cg td{background:var(--canvas)}
.ltab.ctab td.nmc{white-space:nowrap}
.ltab.ctab tr.cg td.nmc{display:flex;align-items:center;gap:var(--s1)}
.ltab.ctab .ccv{flex:none;width:var(--s5);display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:pointer}
.ltab.ctab tr.cm td.cmc{color:var(--t2)}
.ltab.ctab tr.sel td{background:var(--sel)}
.ltab.ctab .fi::placeholder{color:var(--dis)}

/* 工位层两栏（用户 2026-10-13）：非采集节点与工位设置时属性栏铺满右侧，表单列宽仍按 640 档 */
#panes>#proppane.stedit{flex:1;width:auto;border-right:0}
#proppane.stedit .psb{max-width:var(--w-prop)}#proppane.stedit .psec.slw .psb{max-width:640px}
.ltab.wfst.slt th:nth-child(n){width:auto}.ltab.wfst.slt th.num{width:var(--s12)}
#nodelist .tnode.fx .nm{color:var(--t3)}
#nodelist .tnode.fx>.ti-lock{flex:none;font-size:var(--ic-s);color:var(--dis);margin-left:var(--s1)}
.ctview .ctbar .ctlb{color:var(--t2);margin:0 var(--s2) 0 var(--s1);white-space:nowrap}
.ctview .ctbar .fi.ctcam{width:160px;flex:none}

/* 采集节点的采图参数页签：通用、采集两组表单（320）在上，采图表在下 */
.ctview .ctform{flex:none}.ctview .ctform .psb{max-width:var(--w-prop)}

/* 控件宽度三档（规范 §7） */
.fi.w-s{flex:none!important;width:120px!important}
.fi.w-m{flex:none!important;width:180px!important}
.fi.w-l{flex:none!important;width:320px!important}
table.ltab.fit{width:auto!important;table-layout:auto!important}
table.ltab.fit th{width:auto!important}
.fitbox{width:fit-content!important;max-width:100%}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div id="shell">
<div id="rail">
  <div id="logo"><div id="logomark">LOGO</div><div id="logotext"><div class="n">SGamma</div><div class="v" id="protover">v1.1</div></div></div>
    <div class="railbtn" data-rail="proj"><i class="ti ti-file"></i><span>工程管理</span></div>
    <i class="ti ti-chevron-down railsep"></i>
    <div class="railbtn" data-rail="dev"><i class="ti ti-camera"></i><span>设备配置</span></div>
    <i class="ti ti-chevron-down railsep"></i>
    <div class="railbtn on" data-rail="mach"><i class="ti ti-sitemap"></i><span>检测配置</span></div>
    <i class="ti ti-chevron-down railsep"></i>
    <div class="railbtn" data-rail="out"><i class="ti ti-database-export"></i><span>输出设置</span></div>
    <i class="ti ti-chevron-down railsep"></i>
    <div class="railbtn" data-rail="prod"><i class="ti ti-device-desktop"></i><span>生产</span></div>
    <!-- 系统设置：独立一页（不再是弹窗），挂在生产下方、用分割线与业务流程隔开（用户 2026-09-23） -->
    <div class="raildiv"></div>
    <div class="railbtn" data-rail="set"><i class="ti ti-settings"></i><span>系统设置</span></div>
    <!-- 底部整体贴底靠这一层，不靠 #btn-save 的 margin-top:auto——
         生产页会把保存 display:none 收掉，锚点跟着一起消失，设置/操作员就会浮上去。 -->
    <div id="railbottom">
      <div class="railbtn" id="btn-save"><i class="ti ti-device-floppy"></i><span>保存工程</span></div>
      <div class="railfoot">
        <div class="railbtn" id="rb-user"><i class="ti ti-user"></i><span>工程师</span></div>
        <div class="railbtn" id="rb-more" title="更多"><i class="ti ti-dots"></i><span>更多</span></div>
      </div>
    </div>
</div>
<div id="workarea">
<div id="header">
    <div id="tabbar">
      <div id="projname"></div>
      <div id="wbtns">
        <div class="wbtn"><i class="ti ti-minus"></i></div>
        <div class="wbtn"><i class="ti ti-square"></i></div>
        <div class="wbtn close"><i class="ti ti-x"></i></div>
      </div>
    </div>
    <div id="navbar">
      <div id="rgroups"></div>
      <div id="prodhead">
        <div class="rbtn" id="prod-reset" title="把本批的产量/良率等计数清零，不影响历史记录"><i class="ti ti-refresh"></i><span>本批清零</span></div>
        <div class="rbtn" id="prod-check"><i class="ti ti-checkbox"></i><span>点检</span></div>
        <div class="rbtn" id="prod-review"><i class="ti ti-eye-check"></i><span>复判</span></div>
        <div class="rbtn" id="prod-editscene"><i class="ti ti-layout"></i><span>编辑画面</span></div>
      </div>
      <!-- §77 三个数据入口从左段挪出来。左段（#rgroups）宽度锁死 552px 是为了
           让工具箱左边缘对齐主视区；连续执行+停止两个双倍宽主按钮要 233px，
           左段装不下。数据入口本来就不属于那里（§54：工具条只放本页的模式与执行），
           而且到现在还没定义，先放右段等评审。 -->
      <div id="rextra"></div>
      <div id="pinned">
          <div id="runbtns"></div>
      </div>
    </div>
</div>

<div id="body">

  <div id="main">
    <div id="treepane">
      <div id="treehead"><span id="treetitle">检测编辑</span>
        <!-- 「全流程」原来是树里的第一个节点。它跟下面那些节点不是一回事：
             工位/相机/图像是具体对象，它是「不筛选」这个状态。当作节点排在一起，
             既占一行又暗示它跟工位是同级对象。做成标题行最右的按钮，选中态即当前范围。
             注意：不能放进 .acts——检测编辑页 bindTreeHead 会把整个 .acts 隐藏。 -->
      </div>
      <!-- §69 执行/停止/全流程 全部搬到主视区标题栏的面包屑末尾。
           结构树这一行没东西可放了，整条撤掉——空栏正是 §42 治过的那个问题。 -->
      <!-- §81 筛选行从 #tree 内部提出来，与节点栏的 #nodeacts 同级同高。
           它原来嵌在 #tree 里，被 #tree 的 8px 上内边距压下去，
           比节点栏动作行低 8px——而 §71 那条对齐断言只加 CSS 高度声明、
           没算容器内边距，所以一直报「对齐」。 -->
      <div id="treebtns"></div>
      <div id="treeacts"></div>
      <div id="tree"></div>
    </div>
    <div id="nodepane">
      <!-- §67 标题与动作重新拆成两行（撤销 §41 的合并）。用户要求节点栏顶部
           有一条专门放功能按钮的区域。#nodebar 的 id 与内部结构一个字没动——
           所有 JS 选择器（[data-na] / renderIcons / capability 控禁用）照旧。 -->
      <div id="nodehead"><span class="lb">检测流程</span></div>
      <div id="nodeacts">
        <div id="nodebar">
          <span class="nbadd" data-na="add" title="新增节点"><i class="ti ti-plus"></i><span>新增</span></span>
          <i class="ti ti-copy" data-na="copy" title="复制到其他图像"></i>
          <i class="ti ti-trash" data-na="del" title="删除"></i>
          <span class="sp"></span>
          <i class="ti ti-arrow-up" data-na="up" title="上移"></i>
          <i class="ti ti-arrow-down" data-na="down" title="下移"></i>
        </div>
      </div>
      <div id="nodelist"></div>
    </div>
    <div id="rightzone">
      <div id="panes">
        <div id="content">
          <div id="chead">
            <!-- §70 执行/停止在面包屑左侧。面包屑长度随选中在 4~5 段之间变，
                 执行键放右边会跟着左右移动；放左边位置固定，肌肉记忆才立得住。
                 读序也顺：先看动作，再看它作用在哪一级。 -->
            <span id="crun"></span>
            <!-- §74 面包屑撤掉后 #ctitle 在检测编辑页恒为空，
                 §73 那条 .chsep 两头总有一头是空的，永远画不出来，删。
                 分组只剩 #cacts::before 一条，正好对应「执行区 | 画布工具」两组。 -->
            <span id="ctitle"></span>
            <span id="cacts"></span>
          </div>
          <div id="cbody"></div>
        </div>
        <!-- 画布右侧栏（视角层图像栏 / 工位层缩略图）：与画布并列、通顶，画布工具条只在画布上方（用户 2026-10-12） -->
        <div id="cside" class="hide"></div>
        <div id="proppane">
          <div id="propwrap">
            <!-- #propheadin 是动态区（renderProp 每次整体重写），折叠按钮在它外面。
                 上一轮把折叠按钮单独放一条 #proptabs，结果属性栏顶上叠了三条横栏：
                 空页签条 + 标题行 + 分组头。空的那条正是 §42 治过的「空工具条」，
                 这次是我自己造出来的。合并成一行。 -->
            <div id="prophead">
              <div id="propheadin"><span class="nm">属性</span></div>
            </div>
            <div id="propbody"></div>
          </div>
        </div>
        <div id="tbpane" class="hide">
          <div id="tbhead"><span class="nm">新增节点</span></div>
          <div class="tbsearch"><i class="ti ti-search"></i>
            <input id="tbq" placeholder="搜索全部工具…"></div>
          <div id="tbctx"></div>
          <div class="tblist" id="tblist"></div>
        </div>
      </div>
      <div id="dock">
        <div id="dockgrip" title="拖拽调整高度"></div>
        <!-- 七个页签横跨四个层级（本次执行 / 本工程 / 生产 / 程序），
             唯一的共同点是「都是表格」——那是形式不是归属。
             不拆走（拆走等于删功能：底坞只在这一页有），但用分割线把层级差别摆出来，
             至少让人看得出「这几个不是一类东西」。 -->
        <div id="dockbar">
          <div class="ptab dk-mach" data-dk="cdbg"><i class="ti ti-bug"></i>调试信息</div>
          <div class="ptab dk-insp" data-dk="src"><i class="ti ti-photo"></i>图像列表</div>
          <div class="ptab dk-insp" data-dk="sch"><i class="ti ti-bug"></i>调试信息</div>
          <div class="ptab dk-insp" data-dk="dout"><i class="ti ti-flask"></i>调试输出</div>
          <div class="ptab dk-insp" data-dk="def"><i class="ti ti-stain"></i>缺陷明细</div>
          <span class="dsp dk-insp"></span>
          <div class="ptab dk-insp" data-dk="mx"><i class="ti ti-grid"></i>全览</div>
          <!-- 生产输出、报警移出检测编辑（用户 2026-10-07 信息减负）：生产输出是生产画面的元件，报警从状态栏打开 -->
          <span class="u-flex1"></span>
          <i class="ti ti-chevron-down" id="dockToggle" title="收起"></i>
        </div>
        <div id="dockbody">
          <div id="tpbody"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="prodbody" class="hide"></div>
</div>
<div id="guide" class="hide"></div>
</div>
</div>

<div id="status">
  <span id="strun"></span>
  <span class="err" id="stalm" title="查看报警明细"><i class="ti ti-alert-triangle"></i> 报警 —</span>
</div>

<div id="ctx"></div>
<div class="msmenu" id="msmenu"></div>
<div id="dlgmask"></div>

<div id="bsmask"><div id="backstage">
  <div id="bstop"><i class="ti ti-file"></i><span>工程</span><i class="ti ti-x" id="bsclose"></i></div>
  <div id="bsinner"><div id="bsnav"></div>
    <div id="bsmain"><div id="bstitle"></div><div id="bsbody"></div></div></div>
</div></div>

<div id="hmimask">
  <div id="hmitop">
    <i class="ti ti-layout"></i><span class="t">画面编辑</span>
    <span class="s" id="hmisub"></span>
  </div>
  <div id="hmitools">
    <button class="hb dis" data-h="undo"><i class="ti ti-undo"></i>撤销</button>
    <button class="hb dis" data-h="redo"><i class="ti ti-redo"></i>重做</button>

function prodPath(cam){
  return IMGS.filter(im=>{
    const c=camOf(im.cam), st=stOf(c);
    if(st.rel!=='lane')return true;
    const cams=CAMS.filter(x=>x.st===st.no);
    const pick=(cam&&cams.some(x=>x.id===cam))?cam:cams[0].id;
    return c.id===pick;});
}

function pickCam(k,cam){
  const cs=camsOfItem(k);
  return (cam&&cs.some(c=>c.id===cam))?cam:(cs[0]||{}).id;
}
/* 检测项在某相机上的算法配置：AI 缺陷看方案实例（同图多项共用），尺寸看一对一实例 */
function algOf(k,cam){
  const it=ITEMS[k];
  if(it.scope==='all')return null;
  const c=pickCam(k,cam), im=imgOf(k,c);
  if(!im)return null;
  return it.fam==='缺陷'?SCH[im.id]:IMPL[k+'@'+c];
}
/* 实测值 */
function actOf(k,cam){
  const it=ITEMS[k];
  if(it.scope==='all')
    return prodPath(cam).reduce((a,im)=>{
      const o=(SCH[im.id]||{}).out||{};
      return a+(o[it.cls]||0);},0);
  const c=pickCam(k,cam), im=imgOf(k,c);
  if(!im)return null;
  if(it.fam==='缺陷'){const o=(SCH[im.id]||{}).out||{};return o[it.cls];}
  return (IMPL[k+'@'+c]||{}).act;
}
/* 该检测项覆盖哪些工位 */
function stsOf(k){
  const it=ITEMS[k];
  const ims=it.scope==='all'?scopeImgs(k):camsOfItem(k).map(c=>imgOf(k,c.id)).filter(Boolean);
  return [...new Set(ims.map(im=>camOf(im.cam).st))].sort((a,b)=>a-b);
}
/* 汇总项覆盖到哪些图像 */
const scopeImgs=(k,cam)=>prodPath(cam).filter(im=>((SCH[im.id]||{}).out||{})[ITEMS[k].cls]!==undefined);

/* 汇总项贡献最多缺陷的那张图。汇总项本身不属于任何一张图，
   但「哪张图贡献最多」是操作员真正要问的下一个问题。 */
function worstImgOf(k,cam){
  const cls=ITEMS[k].cls;
  let best=null,bn=-1;
  scopeImgs(k,cam).forEach(im=>{
    const n=((SCH[im.id]||{}).out||{})[cls]||0;
    if(n>bn){bn=n;best=im;}});
  return bn>0?best:null;
}

function vd(k,cam){

  if(it.scope!=='all'){const im=imgOf(k,c); if(im&&im.state==='Fail')return 'Fail';}
  if(a==null)return 'Fail';
  if(it.fam==='尺寸')return (a-it.std<=it.tu&&a-it.std>=it.td)?'OK':'NG';
  if(it.fam==='缺陷')return a<=(it.thr??2)?'OK':'NG';
  if(it.fam==='字符')return it.mode==='不比对'?'OK':(String(a)===it.expect?'OK':'NG');
  return 'OK';}

/* 相机最短曝光间隔（ms）。触发间隔的下限由它推导 ——
   CALYPSO 的安全平面就是这个思路：让人声明约束，路径由软件算，
   而不是让人填一个值、跑起来才报「低于相机最短曝光间隔」。 */
const EXPMIN={D1:1.2,D2:1.2,D3:2.4,D4:1.8,D5:2.4,D6:2.4};
const stCams=st=>CAMS.filter(c=>c.st===st.no);
function trigRange(st){
  const lo=+(Math.max(...stCams(st).map(c=>EXPMIN[c.dev]||1.5),1.5)*1.15).toFixed(1);
  const hi=+(((+st.to||3000)*0.8)/Math.max(1,batchN(st))).toFixed(1);
  return [lo,Math.max(hi,lo)];
}
const trigOf=st=>{const [lo,hi]=trigRange(st);
  if(st.trig==null)st.trig=+((lo+hi)/2).toFixed(1);
  return st.trig;};
const trigBad=st=>{const [lo,hi]=trigRange(st),v=+trigOf(st);return v<lo||v>hi;};

/* 一次触发处理几个穴位 */
/* 穴位数三种工位都能推出来，不需要用户填：
   定拍 / 激光 恒为 1；MQ 等于相机数；飞拍等于那台相机的图像数（一穴一张） */
/* 采图数量（用户 2026-10-12）：一个采集节点一次触发采 N 张，每张一个视角。飞拍记在相机上（每穴 N 张，图像按穴位、再按张排） */
const shotN=c=>Math.max(1,(c&&c.nshot)||1);
const shotK=im=>{const c=camOf(im.cam);return imgsOf(im.cam).indexOf(im)%shotN(c);};
const shotName=(c,k)=>(c.vn&&c.vn[k])||(k?`${c.vname||'外观'} ${k+1}`:(c.vname||'外观'));
function batchN(st){
  const cams=CAMS.filter(c=>c.st===st.no);
  if(st.rel!=='lane')return 1;
  if(prodMap(st)==='shot')return Math.max(cams[0]?Math.floor(imgsOf(cams[0].id).length/shotN(cams[0])):1,1);
  return Math.max(cams.length,1);
}
/* 寄存器地址一穴一行，逐格填，不按步长推算 ——
   现场的地址表是电控给的，未必连续，推算出来的值看着对、其实是猜的。
   穴位数变了只补空行或截掉多余行，已填的地址不动。 */
function syncSigLen(st){
  const n=Math.min(64,Math.max(1,batchN(st)|0));
  ['pid','res'].forEach(k=>{
    const a=st.sig[k]||(st.sig[k]=[]);
    while(a.length<n)a.push('');
    a.length=n;});
}

 {g:'缺陷',ic:'stain',items:[['brain','AI 检测'],['stain','传统缺陷'],['diff','差分检测'],
   ['stain','背景纹理抑制'],['gray','灰度异常筛查']]},

   ['flatness','平面度'],['cube3d','体积']]},
 /* 逻辑 / 数据 / 通讯（用户 2026-10-08 按老版工具补齐，同日评估后精简）：建成检测流程里的流程节点，排在方案之后。

 /* 通讯组已删（用户 2026-10-13）：与外部的收发属于采图流程，只在采图流程的工具箱添加 */

/* 工具 → 节点：点工具箱在当前图像上建元素或方案 */
const ELTYPE={点:'点',直线:'直线',圆:'圆',圆弧:'圆',椭圆:'圆',矩形:'矩形',
  边缘点:'点',边缘线:'直线',两线交点:'点',中点:'点',偏移:'点',平行线:'直线',垂线:'直线',
  平面拟合:'平面',点云匹配:'平面'};
const ELGRP=new Set(['元素']);
const MEASURE=new Set(['点点距离','点线距离','线线距离','圆直径','圆半径','圆心距','两线夹角',

const nid=(p,k)=>p==='e'?newElId():newItemId();
/* 节点显示名的序号：本图内自增，不跟全局 id 走 */
const nodeSeq=(im,tool)=>im.els.filter(e=>ELS[e].alg===tool).length
                        +im.items.filter(k=>ITEMS[k].scheme===tool).length+1;

function toolGroup(name){
  for(const g of TOOLS) if(g.items.some(x=>x[1]===name)) return g.g;
  return '';
}
/* 默认输出量：按几何类型给一组，运行时由算法填实际值 */
function elOut(type){
  if(type==='圆')return {'圆心 X':[0,'px'],'圆心 Y':[0,'px'],'半径':[0,'px'],'直径':[0,'px'],
    '圆度':[0,''],'参与拟合点':[0,'点'],'剔除点':[0,'点']};
  if(type==='直线')return {'起点 X':[0,'px'],'起点 Y':[0,'px'],'终点 X':[0,'px'],'终点 Y':[0,'px'],
    '角度':[0,'°'],'长度':[0,'px'],'直线度':[0,'px'],'参与拟合点':[0,'点'],'剔除点':[0,'点']};
  if(type==='平面')return {'法向 X':[0,''],'法向 Y':[0,''],'法向 Z':[0,''],
    '拟合误差':[0,'mm'],'参与拟合点':[0,'点'],'剔除点':[0,'点']};
  if(type==='矩形')return {'中心 X':[0,'px'],'中心 Y':[0,'px'],'宽':[0,'px'],'高':[0,'px'],'角度':[0,'°']};
  return {'X':[0,'px'],'Y':[0,'px']};
}
function addNode(tool){
  const im=curImg(); if(!im)return null;
  const grp=toolGroup(tool);
  if(grp==='逻辑'||grp==='数据'){   /* 流程节点：加在检测流程末尾（方案之后） */
    const all=allSigIds(), id=nextId('g',all);
    /* 这几种就是已有的发送 / 接收节点，目标预设好 */
    const IO={'读取缓存值':['recv','var:'+(GVARS[0]||'')],'写入缓存值':['send','var:'+(GVARS[0]||'')]};
    let g;
    if(tool==='延时')g={id,k:'delay',ms:null,dly:100,cond:'',tmo:'',tgt:null,n:'延时 100 ms'};
    else if(IO[tool]){const tgt=tgtFromKey(IO[tool][1]);g={id,k:IO[tool][0],ms:null,dly:null,cond:'',tmo:'',tgt,n:(IO[tool][0]==='recv'?'读取 ':'写入 ')+tgtName(tgt)};}
    else g={id,k:'fx',tool,ms:null,n:tool};
    sigsOf(schemeHost(im),'flow').push(g);DIRTY++;
    S.sel={t:'sig',id:g.id};
    return {kind:'sig',id:g.id};
  }
  if(grp==='定位'){                       /* 一张图可以有多个定位，第一个是默认坐标系 */
    const it=TOOLS[0].items.find(x=>x[1]===tool);
    const L=newLoc((it&&it[2])||'模板匹配');
    locsOf(im).push(L);
    S.sel={t:'loc',id:L.id};
    return {kind:'loc',id:L.id};
  }
  if(ELGRP.has(grp)){
    const type=ELTYPE[tool]||'点';
    const e=nid('e','el'), sq=nodeSeq(im,tool);
    ELS[e]={n:`${tool} ${sq}`,type,alg:tool,roi:'待框选',ms:0,par:'默认参数',out:elOut(type)};
    im.els.push(e);
    S.sel={t:'el',id:e};
    return {kind:'el',id:e};
  }
  if(DEFECTTOOL.has(tool)){
    if(!SCH[im.id])SCH[im.id]={model:'未选择',roi:'待框选',conf:.6,area:.01,out:{},lim:{}};
    S.sel={t:'sch',id:'ai:'+im.id};
    return {kind:'sch',id:'ai:'+im.id};
  }
  const k=nid('m','item'), sq=nodeSeq(im,tool);
  if(MEASURE.has(tool)){
    const is3D=/高度差|平面度|体积|点云/.test(tool);
    ITEMS[k]={n:`${tool} ${sq}`,fam:'尺寸',scheme:tool,std:0,tu:.05,td:-.05,
      out:1,jud:1,scale:is3D?1:null};
  }else if(TEXTTOOL.has(tool)){
    ITEMS[k]={n:`${tool} ${sq}`,fam:'字符',scheme:tool,mode:'固定内容',expect:'',out:1,jud:1};
  }else{
    ITEMS[k]={n:`${tool} ${sq}`,fam:'尺寸',scheme:tool,std:0,tu:.05,td:-.05,out:1,jud:1,scale:null};
  }
  IMPL[k+'@'+im.cam]={roi:'待框选',act:null};
  im.items.push(k);
  if(ORDER)ORDER.push(k);
  S.sel={t:'sch',id:'it:'+k+'@'+im.cam};
  return {kind:'sch',id:'it:'+k+'@'+im.cam};
}

/* 节点面板：当前图像的元素与方案 */
/* 元素的执行顺序：引用它的检测项必须排在它后面 */
function nodeMove(dir){
  if(S.sel.t==='loc'){                    /* 顺序决定谁是默认坐标系 */
    const r=locById(S.sel.id); if(!r)return;
    const ls=locsOf(r.im), i=ls.indexOf(r.l), j=i+dir;
    if(j<0||j>=ls.length)return;
    ls.splice(j,0,ls.splice(i,1)[0]);DIRTY++;renderAll();syncDock();
    if(j===0||i===0)toast(`默认坐标系现在是「${ls[0].m}」`);
    return;
  }
  if(S.sel.t==='sig'){                    /* 流程节点只在流程节点之间换序 */
    const r=sigById(S.sel.id); if(!r)return;
    const a=sigsOf(r.im,r.seg), i=a.indexOf(r.g), j=i+dir;
    if(j<0||j>=a.length)return;
    a.splice(j,0,a.splice(i,1)[0]);DIRTY++;renderAll();syncDock();
    return toast(`「${r.g.n}」已${dir<0?'上':'下'}移`);
  }
  if(S.sel.t!=='el')return toast(S.sel.t==='sch'?'方案的执行顺序跟随它引用的元素':'先选中一个元素');
  const im=schemeHost(curImg()), e=S.sel.id;
  const i=im.els.indexOf(e), j=i+dir;
  if(i<0||j<0||j>=im.els.length)return;
  const other=im.els[j];
  im.els[i]=other;im.els[j]=e;DIRTY++;renderAll();
  toast(`「${ELS[e].n}」与「${ELS[other].n}」已换序`);
}

/* 飞拍工位一台相机拍同一个画面，全部图像强制共用一套方案，宿主是第一张图。
   曝光增益各图可以不同，方案只有一份 */
function schemeShared(im){
  const c=camOf(im.cam); if(!c)return false;
  const st=stOf(c), m=prodMap(st);
  /* 用户 2026-10-09 对象模型：一个视角一套方案。飞拍各穴、MQ 各相机同序号的图属于同一视角 */
  return m==='shot'?batchN(st)>1 : m==='cam'?stCams(st).length>1 : false;
}
const schemeHost=im=>{
  if(!schemeShared(im))return im;
  const c=camOf(im.cam), st=stOf(c);
  if(prodMap(st)==='shot')return imgsOf(c.id)[shotK(im)]||im;
  return imgsOf(stCams(st)[0].id)[imgsOf(c.id).indexOf(im)]||im;};

/* 同一套方案下，各穴位分别采到的图。
   飞拍：同一台相机的各穴（方案共用，只是曝光不同）
   MQ  ：同工位各相机的同序号图（同一个视角，方案各穴分开编）
   定拍：各相机拍不同的面，没有可切的穴位 */
function slotImgs(im){
  const c=camOf(im.cam); if(!c)return [];
  const st=stOf(c);
  if(prodMap(st)==='shot')return rowCells(im);
  if(viewLinked(st)){
    const j=imgsOf(c.id).indexOf(im);
    return CAMS.filter(x=>x.st===st.no).map(x=>imgsOf(x.id)[j]).filter(Boolean);
  }
  return [];
}
function slotNo(im){
  const c=camOf(im.cam), st=stOf(c);
  return prodMap(st)==='shot' ? Math.floor(imgsOf(c.id).indexOf(im)/shotN(c))+1
    : CAMS.filter(x=>x.st===st.no).findIndex(x=>x.id===c.id)+1;
}

/* 选中项能解析成哪张图；全流程 / 工位 / 相机 解析不出来 */
function imgFromSel(){
  return S.sel.t==='loc'?locImg(S.sel.id)
    : S.sel.t==='img'?IMGS.find(x=>x.id===S.sel.id)
    : S.sel.t==='el'?imgOfEl(S.sel.id)
    : S.sel.t==='sch'?schInfo(S.sel.id).im
    : (S.sel.t==='item'&&ITEMS[S.sel.id]&&ITEMS[S.sel.id].scope!=='all')?imgOf(S.sel.id,S.sel.cam)
    : null;
}
/* ---- 方案栏的范围 ----
   范围只由树决定：树上选全流程 / 工位 / 相机就进汇总，选图像就回单图。
   在方案栏里点元素或方案、在矩阵里点格子，只换画布，不换范围 ——
   点一个节点就把整份汇总收掉，等于每看一个节点都要回树上重选一次。 */
let PSCOPE=null;
function syncScope(){
  const t=S.sel.t;
  if(/^(all|st|cam|flow)$/.test(t))PSCOPE={t,id:S.sel.id};
  else if(t==='img')PSCOPE=null;
  /* el / sch / loc / item 不动范围：它们是在范围里点出来的 */
}
const inspStub=()=>S.rail==='insp'&&!!PSCOPE;
/* 范围里的图像，按工位 → 相机 → 序号排 */
function selImgs(){
  const t=(PSCOPE||{}).t,id=(PSCOPE||{}).id;
  const cams=t==='cam'?CAMS.filter(c=>c.id===id)
    :t==='st' ?CAMS.filter(c=>c.st==id)
    :CAMS.slice();
  return cams.flatMap(c=>imgsOf(c.id));
}
/* 画布记住「当前正在编辑的图像」。
   范围切成工位 / 相机时，当前图像已经在范围里就不动，不在才跳到范围内第一张 ——
   在同一范围内点来点去不该把画布甩走。
   全流程不跳：全流程套着所有图，当前这张本来就在里面。 */
function curImg(){
  const im=imgFromSel();
  if(im&&LOCAL&&LOCAL.img!==im.id)LOCAL=null;   /* 本地源跟着图位走，换图就撤 */
  if(im&&S.sel.t==='img'){S.cell=im.id;S.rowf=0;}   /* 选中的就是这一张图（用户 2026-10-12：以图像为中心） */
  if(im)S.img=im.id;
  else if(PSCOPE&&(PSCOPE.t==='st'||PSCOPE.t==='cam')){
    const list=selImgs();
    if(list.length&&!list.some(x=>x.id===S.img))S.img=list[0].id;
  }
  const base=IMGS.find(x=>x.id===S.img)||IMGS[0];
  /* 格聚焦（用户 2026-10-09）：共用方案的一行里选了某一穴，画布与属性按这一格 */
  if(S.rail==='insp'&&!S.rowf&&S.cell){const c=rowCells(schemeHost(base)).find(x=>x.id===S.cell);if(c){S.img=c.id;return c;}}
  return base;
}
/* 当前行是否共用方案（多于一格）；行聚焦＝S.rowf，格聚焦＝S.cell */
const rowShared=im=>rowCells(schemeHost(im)).length>1;
const inRow=()=>S.rail==='insp'&&rowShared(curImg())&&!!S.rowf;
const inCell=()=>S.rail==='insp'&&rowShared(curImg())&&!S.rowf;
/* 中栏与右栏：树上选的是范围时按「当前图像」渲染 */
function asImg(fn){
  if(!(S.rail==='insp'&&/^(all|st|cam|flow)$/.test(S.sel.t)))return fn();
  const s0=S.sel; S.sel={t:'img',id:curImg().id};
  try{return fn();}finally{S.sel=s0;}
}
/* 方案栏的范围：选中图像或它下面的节点 = 那一张；
   选中全流程 / 工位 / 相机 = 范围内全部图像的定位、元素、方案汇总。
   飞拍共用一套方案，所以按方案宿主去重，否则同一套要列六遍。 */
function paneImgs(){
  const list=inspStub()?selImgs():[curImg()];
  const seen=new Set();
  return list.map(schemeHost).filter(x=>x&&!seen.has(x.id)&&seen.add(x.id));
}
/* 当前图像切换器（用户 2026-10-07）：工位 → 相机 → 图像三级下拉 ＋ 上一张 / 下一张（全机总览只在底坞「全览」页签，不在这里另放入口）。
   飞拍一台相机的各穴共用一套方案，列表里只出方案宿主（穴位在画布标题栏切），与原结构树一致 */
function inspImgs(c){let imgs=IMGS.filter(x=>x.cam===c.id);if(imgs.length&&schemeShared(imgs[0]))imgs=[imgs[0]];return imgs;}
/* 用户 2026-10-09 对象模型：检测编辑先选「工位 · 视角」（一套方案），再在画布标题栏选穴位（一格） */
function inspOrder(){return STATIONS.flatMap(st=>viewsOf(st).map(v=>v.host));}
function renderImgSel(){
  const box=$('#imgsel'); if(!box)return;
  const im=schemeHost(curImg()), c=camOf(im.cam), st=stOf(c), vs=viewsOf(st);
  const order=inspOrder(), i=order.findIndex(x=>x.id===im.id);
  const opt=(v,tx,on)=>`<option value="${v}"${on?' selected':''}>${tx}</option>`;
  box.innerHTML=`
      <div class="isrow"><span>工位</span><select class="fi" data-isel="st" title="工位">${STATIONS.filter(x=>viewsOf(x).length).map(x=>opt(x.no,`工位${x.no} ${x.name}`,x.no===st.no)).join('')}</select></div>
      <div class="isrow"><span>图像</span><select class="fi img" data-isel="view" title="图像">${vs.map(v=>opt(v.host.id,viewName(st,v),v.host.id===im.id)).join('')}</select></div>
      <div class="rrow">
        <div class="rbtn${i>0?'':' dis'}" data-isel-go="-1" title="上一张图像">${I('chevron-left')}<span>上一个</span></div>
        <div class="rbtn${i<order.length-1?'':' dis'}" data-isel-go="1" title="下一张图像">${I('chevron-right')}<span>下一个</span></div></div>`;
  renderIcons(box);
  /* 换视角：共用方案的行默认「全行」 */
  const go=x=>{if(!x)return;S.sel={t:'img',id:x.id};S.cell=x.id;S.rowf=0;renderAll();syncDock();};
  box.querySelector('[data-isel="st"]').onchange=e=>{const t=STATIONS.find(q=>q.no==e.target.value);go(t&&(viewsOf(t)[0]||{}).host);};
  box.querySelector('[data-isel="view"]').onchange=e=>go(IMGS.find(x=>x.id===e.target.value));
  box.querySelectorAll('[data-isel-go]').forEach(b=>b.onclick=()=>{if(b.classList.contains('dis'))return;go(order[i+(+b.dataset.iselGo)]);});
}
const NODEBAR0=document.getElementById('nodebar').innerHTML;
function renderNodePane(){
  const pane=$('#nodepane');
  const show = S.rail==='insp'||(S.rail==='mach'&&S.sel.t==='st'&&!PRODMODE);
  pane.classList.toggle('hide',!show);
  /* §88 离开检测编辑要把开关清掉。节点栏整栏是 hide 的、看不见，但 DOM 里会留着
     上一张图的「信号 N」——那是一份没人维护的陈旧状态，而且它让每一页的快照都变长 92。
     跟 renderTbDispatch 清 #rextra 是同一个处理。 */
  if(!show){const sg0=$('#sigtoggle'); if(sg0)sg0.innerHTML=''; return;}
  if(S.rail==='mach')return;   /* 采图流程列表由 machPaint 绘制 */
  if(!$('#nodebar [data-na="add"]'))$('#nodebar').innerHTML=NODEBAR0;
  $('#nodehead .lb').textContent='检测流程';
  renderImgSel();
  const cur=curImg(), c=camOf(cur.cam);

  const list=paneImgs(), multi=list.length>1;
  const src=x=>multi?`<span class="nsrc">${camOf(x.cam).name}·${x.name}</span>`:'';
  const els=list.flatMap(x=>x.els.map(e=>[e,x]));
  const schs=list.flatMap(x=>schsOf(x).map(sh=>[sh,x]));
  let h='';
  /* 方案栏两种显示方式（用户 2026-10-08）：「全览」＝依赖树（定位 → 跟随它的元素 → 用到元素的方案 → 输出的检测项），
     「按类型」＝定位 / 元素 / 方案 / 流程四组。采图节点与采图前 / 采图后已移出检测流程（用户 2026-10-09）：
     采图前 / 采图后在机台结构工位页配置，曝光 / 增益 / AOI 由工具条「采图参数」打开。
     一个元素被多个方案引用时，方案在每个元素下都出现一次。 */
  const nsig=list.reduce((a,x)=>a+allSigs(x).length,0);
  const st0='<span class="sdot stale"></span>';
  const none0='<span class="sdot none"></span>';
  const lvc=lv=>lv?` lv${Math.min(lv,4)}`:'';
  const rowSig=(g,x,lv)=>`<div class="tnode${lvc(lv)}${S.sel.t==='sig'&&S.sel.id===g.id?' sel':''}" data-nsig="${g.id}">
      ${I(sigIco(g))}<span class="nm">${g.n}</span>${src(x)}
      ${STALE[g.id]?st0:g.ms?`<span class="tcnt">${g.ms} ms</span><span class="sdot ${g.v?lampCls(g.v):'ok'}"></span>`:none0}</div>`;
  const rowLoc=(L,x,i,lv)=>`<div class="tnode${lvc(lv)}${S.sel.t==='loc'&&S.sel.id===L.id?' sel':''}" data-nloc="${L.id}">
      ${I(LOCM[L.m]?LOCM[L.m].i:'target')}<span class="nm">${L.m}</span>${i===0?'<span class="ndef">默认</span>':''}${src(x)}
      <span class="tcnt">6 ms</span><span class="sdot ok"></span></div>`;
  const rowEl=(e,x,lv)=>`<div class="tnode${lvc(lv)}${S.sel.t==='el'&&S.sel.id===e?' sel':''}" data-nel="${e}">
      ${I(elIcon(ELS[e].type))}<span class="nm">${ELS[e].n}</span>${src(x)}
      ${STALE[e]?st0:ELS[e].ms?`<span class="tcnt">${ELS[e].ms} ms</span><span class="sdot ok"></span>`:none0}</div>`;
  const rowSch=(sh,x,lv)=>`<div class="tnode${lvc(lv)}${S.sel.t==='sch'&&S.sel.id===sh.id?' sel':''}" data-nsch="${sh.id}" title="${sh.tip}">
      ${I(sh.ic)}<span class="nm">${sh.n}</span>${src(x)}
      ${STALE[sh.id]?st0:sh.ms?`<span class="tcnt">${sh.ms} ms</span><span class="sdot ${lampCls(sh.v)}"></span>`:none0}</div>`;
  const rowLeaf=(ic,n,lv)=>`<div class="tnode leaf${lvc(lv)}">${I(ic)}<span class="nm">${n}</span></div>`;
  /* 只保留执行顺序一种显示（用户 2026-10-10 易用性：去掉「全览 / 按类型」切换） */
  const view='tree';
  if(view==='type'){
    const locs=list.flatMap(x=>locsOf(x).map((L,i)=>[L,x,i]));
    const fxs=list.flatMap(x=>sigsOf(x,'flow').map(g=>[g,x]));
    h+=`<div class="tgrp">定位<span class="c">${locs.length}</span></div>`;
    if(!locs.length)h+='<div class="tempty">不定位 · 按图像绝对坐标</div>';
    locs.forEach(([L,x,i])=>{h+=rowLoc(L,x,i,0);});
    h+=`<div class="tgrp">元素<span class="c">${els.length}</span></div>`;
    if(!els.length)h+='<div class="tempty">用工具箱新建</div>';
    els.forEach(([e,x])=>{h+=rowEl(e,x,0);});
    h+=`<div class="tgrp">方案<span class="c">${schs.length}</span></div>`;
    if(!schs.length)h+='<div class="tempty">用工具箱新建</div>';
    schs.forEach(([sh,x])=>{h+=rowSch(sh,x,0);});
    if(fxs.length){h+=`<div class="tgrp">流程<span class="c">${fxs.length}</span></div>`;
      fxs.forEach(([g,x])=>{h+=rowSig(g,x,0);});}
  } else {
    /* 全览＝实际执行顺序，一条平铺的序列、带序号，不分组（用户 2026-10-08）：
       定位 → 元素（引用它的方案紧跟在它最后一个被引用元素之后）→ 不引用元素的方案 → 流程节点 */
    let no=0;
    const sq=()=>`<span class="nseq">${++no}</span>`;
    const tag=(html)=>html.replace('class="tnode','class="tnode seq').replace(/(data-n(?:sig|loc|el|sch|cap)="[^"]*"[^>]*>)/,'$1'+sq());
    list.forEach(x=>{
      locsOf(x).forEach((L,i)=>{h+=tag(rowLoc(L,x,i,0));});
      const shs=schsOf(x).map(sh=>({sh,refs:((((schInfo(sh.id)||{}).sc)||{}).refs||[]).filter(e=>x.els.includes(e))}));
      const done=new Set();
      x.els.forEach(e=>{h+=tag(rowEl(e,x,0));
        shs.filter(o=>o.refs.length&&!done.has(o.sh.id)&&o.refs.every(r=>x.els.indexOf(r)<=x.els.indexOf(e)))
          .forEach(o=>{done.add(o.sh.id);h+=tag(rowSch(o.sh,x,0));});});
      shs.filter(o=>!done.has(o.sh.id)).forEach(o=>{h+=tag(rowSch(o.sh,x,0));});
      sigsOf(x,'flow').forEach(g=>{h+=tag(rowSig(g,x,0));});
    });
    if(!no)h+='<div class="tempty">用工具箱新建</div>';
  }
  $('#nodelist').innerHTML=h;renderIcons($('#nodelist'));
  const im=schemeHost(cur);
  /* 工具条按当前选中的节点类型启停 */
  const isEl=S.sel.t==='el', isLoc=S.sel.t==='loc', isSig=S.sel.t==='sig';
  const isNode=isEl||S.sel.t==='sch'||isLoc||isSig;
  const lr=isLoc?locById(S.sel.id):null;
  const sr=isSig?sigById(S.sel.id):null;
  const eim=isEl?(imgOfEl(S.sel.id)||im):(lr?lr.im:(sr?sr.im:im));
  /* §88/D3 上移下移不跨段。不是加一道判断去拦，而是让「可移动的范围」本身就只有这一段——
     arr 只装本段的 id，越界这件事在数据上就不存在。 */
  const arr=isLoc&&lr?locsOf(lr.im).map(x=>x.id)
    :isSig&&sr?sigsOf(sr.im,sr.seg).map(x=>x.id)
    :(isEl?eim.els:[]);
  const eli=arr.indexOf(S.sel.id);
  /* 锁定不是把按钮藏起来，是禁用并说明原因（About Face：disable-with-reason）。 */
  const lkd=schemeLocked();
  const TIP0={copy:'复制到其他图像',copycam:'把本相机全部图像的检测项复制到其他相机',del:'删除',up:'上移',down:'下移'};
  $$('#nodebar [data-na]').forEach(el=>{const a=el.dataset.na;
    let ok = a==='add'?true : a==='copycam'?!!curImg() : a==='copy'?(isNode&&!isLoc) : a==='del'?(isEl||S.sel.t==='sch'||isLoc||isSig)
      : a==='up'?(eli>0) : (eli>=0&&eli<arr.length-1);
    if(lkd&&a!=='copycam')ok=false;   /* 锁定只防改本方案；把它复制出去不改它 */
    const treeMv=false;   /* 全览就是执行顺序，上移下移在两种显示下都可用 */
    el.classList.toggle('dis',!ok);
    /* 灰着不说话，用户会以为界面坏了。到段边界时要说清是「已经在头/尾」，
       而不是让人怀疑上移下移坏了——尤其信号节点的段边界是一条设计规则，不是 bug。 */
    let tip=TIP0[a]||el.title;
    if(treeMv)tip+='（在「按类型」显示下调整顺序）';
    el.title=tip;
    if(lkd)el.title=(el.title||'').replace(/ · 方案已锁定$/,'')+' · 方案已锁定';});
  /* 执行 / 停止：手就在方案栏上，不用跑去右上角。范围仍是树上选中的那一项 */
  const rs=runScope();
  const rb=$('#nodebar [data-dbg="once"]'), sb=$('#nodebar [data-dbg="stop"]');
  if(rb){rb.classList.toggle('dis',!rs);
    rb.title=rs?`测试 ${rs.n}${rs.sub?' · '+rs.sub:''}  (F5)`:'先在树上选中要跑的范围';}
  if(sb)sb.title='停止测试  (Esc)';
  renderIcons($('#nodebar'));bindDbg($('#nodebar'));
  $$('#nodelist [data-nloc]').forEach(el=>el.onclick=()=>{
    S.ptool=false;S.sel={t:'loc',id:el.dataset.nloc};renderAll();syncDock();});
  $$('#nodelist [data-nel]').forEach(el=>el.onclick=()=>{
    S.ptool=false;S.sel={t:'el',id:el.dataset.nel};renderAll();syncDock();});
  $$('#nodelist [data-nsch]').forEach(el=>el.onclick=()=>{
    S.ptool=false;S.sel={t:'sch',id:el.dataset.nsch};renderAll();syncDock();});
  $$('#nodelist [data-nsig]').forEach(el=>el.onclick=()=>{
    S.ptool=false;S.sel={t:'sig',id:el.dataset.nsig};renderAll();syncDock();});
  $$('#nodebar [data-na]').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('dis'))return;
    const a=el.dataset.na;
    if(a==='add'){S.ptool=!S.ptool;S.ptoolSel=JSON.stringify(S.sel);renderAll();return;}
    if(a==='copy')copyNodeDlg();
    else if(a==='copycam'){const im=curImg();if(im)copyItemsDlg(im.cam);}
    else if(a==='del'){if(/^(el|sch|loc|sig)$/.test(S.sel.t))delElement();else toast('先选中一个节点');}
    else if(a==='up'||a==='down')nodeMove(a==='up'?-1:1);
    });
}

/* ================= 工具箱（画布右侧一栏） =================
   2026-10-08 从工具条的「组按钮 + 弹层」搬回竖栏：放在原属性栏的位置（属性栏已移到画布左侧）。
   形态回到按组折叠的竖列表（TBOPEN），常用排第一组；工具本身、点击行为、addNode 不变。
   工具条上不再有组按钮——同一入口只留一处。 */
/* 工具箱与属性栏共用一个位置（用户 2026-10-08）：点检测流程栏的「新增」→ 这里显示工具箱；
   再选中检测流程里的节点或在画布上点选 → 回到属性栏。选中对象一变就自动回到属性栏 */
function syncPtool(){
  const insp=S.rail==='insp'&&!PRODMODE;
  if(S.ptool&&S.ptoolSel!==JSON.stringify(S.sel))S.ptool=false;
  const t=insp&&!!S.ptool;
  const tb=$('#tbpane'); if(tb)tb.classList.toggle('hide',!t);
  const pp=$('#proppane'); if(pp&&insp)pp.classList.toggle('hide',t);
  const b=$('#nodebar [data-na="add"]'); if(b){b.classList.toggle('on',t);b.title=t?'收起工具箱，回到属性':'新增节点';}
  return t;
}
/* 画布上点选（原型里画布图形不可单独点选，点画布即视为在画布上选中）也回到属性栏 */
document.addEventListener('click',e=>{
  if(S.ptool&&e.target.closest&&e.target.closest('#cbody #cvwrap')){S.ptool=false;renderAll();}});
function renderTbBar(){
  const pane=$('#tbpane'); if(!pane)return;
  if(syncPtool())renderTbPop();
}

function renderTbPop(){
  const canUse = S.rail==='insp' && !schemeLocked();
  /* §72 原来这里常驻一行「加到「反面」的方案」。§56 加它是因为工具箱在工具条、
     图在主视区、方案在节点栏，隔着两层，用户不知道这个「圆」会加到哪张图。
     §69 之后主视区标题栏常驻完整范围路径（全流程 › 工位 › 相机 › 反面），
     这行字变成了「描述界面上已经能看出来的事」——需求 12.1 点名要砍的那一类。
     只保留锁定时的那句：它是禁用的原因（§56「禁用要给原因」），不是重复。 */
  $('#tbctx').innerHTML = schemeLocked()
    ? `${I('lock')}方案已锁定，先在画布上右键解锁`
    : '';
  const q=TBQ.trim().toLowerCase();
  const row=(ic,n)=>`<div class="tbi${TBSEL===n?' on':''}${canUse?'':' dis'}" data-t="${n}">${I(ic)}${n}</div>`;
  const ICON=n=>{const it=TOOLS.flatMap(g=>g.items).find(x=>x[1]===n);return it?it[0]:'point';};
  const groups=[{g:'常用',ic:'pin',items:FAV.map(n=>[ICON(n),n])},...TOOLS];
  let h='';
  groups.forEach(g=>{
    const items=q?g.items.filter(x=>x[1].toLowerCase().includes(q)):g.items;
    if(!items.length)return;
    h+=`<div class="tbg" data-g="${g.g}">${I(g.ic)}${g.g}</div>`;
    items.forEach(x=>h+=row(x[0],x[1]));});
  $('#tblist').innerHTML=h||'<div class="tbempty">没有匹配的工具</div>';
  renderIcons($('#tbpane'));
  $$('#tblist .tbi').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('dis'))return;
    TBSEL=el.dataset.t;
    const r=addNode(TBSEL);
    /* 从工具箱新建后留在工具箱，便于连续添加（用户 2026-10-08）：新节点仍被选中，只是不切回属性栏 */
    if(r)S.ptoolSel=JSON.stringify(S.sel);
    if(r){renderAll();renderTbPop();}
    else{renderTbPop();renderContent();}});
}

/* ================= 功能区 ================= */
/* ================= 执行 =================
   只有一个动作：执行。范围就是树上选中的那一项，不另设范围下拉。
     节点 / 图像 / 相机  不消费新产品，跑完不进调试输出
     工位 / 全流程       消费真实产品，结果进产品数据表，进调试输出

   在线 = 等电控请求采图，按 PLC 节拍跑
   离线 = 跑历史图像，不等握手。模式是全局状态，显示在底部状态栏      */
let PRODMODE=false;
const DBG={scope:'all',mode:'online',running:null,rn:'',count:0,hist:1,histN:48,
  /* §86 执行选项。两个都只存这一份，菜单勾选态、按钮 .on、状态栏标记都读它。
     §88 noExt 默认改 true：信号节点落地后，单跑一个发送节点会真的拨动现场电磁阀，
     默认不保护等于把一个危险动作设成默认行为。
     它挂在 DBG（会话状态）上而不是任何工程数据结构上，这是「不进工程文件」的实现方式——
     工程数据是 IMGS / STATIONS / ITEMS 那些，DBG 不在其中，保存时自然带不走。 */
  pauseNG:false,noExt:true};

const modeText=()=>DBG.mode==='online'?'实时图像':`本地图像 ${DBG.hist}/${DBG.histN}`;

/* 执行的范围就是树上选中的那一项。lv 越大跑得越多；
   lv<4 只影响执行范围；连续执行恒为全流程，停止全局可用 */
/* §68 执行范围拆成两侧，因为它本来就来自两栏：
     结构树给出 全流程 / 工位 / 相机 / 图像（3 档）
     节点栏给出 定位 / 元素 / 算法（2 档）
   以前一个按钮串着五档，标签在两栏之间无声跳变；现在各栏管各栏，
   两个按钮永远跑不同的东西——这才不是 §54 删掉的那种重复入口。 */
function treeScope(){
  const t=S.sel.t, id=S.sel.id;
  /* §76 全流程回到结构树筛选行，t==='all' 又可达了，分支加回来。
     §75 删它是因为当时确实没有任何地方能设这个值——不可达分支必须删，
     可达了就得补回来，两次都是按「当下是否真能走到」判断，不是凭习惯。 */
  if(t==='all') return {lv:5,k:'全流程',n:'全流程'};
  if(t==='st'){const st=STATIONS.find(x=>x.no==id);
    return st?{lv:4,k:'工位',n:`工位${st.no} ${st.name}`}:null;}
  if(t==='cam'){const c=camOf(id);
    return c?{lv:3,k:'相机',n:c.name,sub:`${imgsOf(c.id).length} 张图`}:null;}
  /* 选中的是节点时，树上高亮的仍是那张图，所以树这一侧退到图像级 */
  const im=curImg();
  return im?{lv:2,k:'图像',n:im.name,sub:`${im.els.length+schsOf(im).length} 个节点`}:null;
}
function nodeScope(){
  const t=S.sel.t, id=S.sel.id;
  if(t==='el')  return ELS[id]?{lv:1,k:'元素',n:ELS[id].n}:null;
  if(t==='sch'){const inf=schInfo(id);
    return inf?{lv:1,k:'方案',n:inf.kind==='ai'?'AI 检测':ITEMS[inf.key].scheme}:null;}
  if(t==='loc'){const r=locById(id);return r?{lv:1,k:'定位',n:r.l.m}:null;}
  /* §88 图像自定义节点也是节点级范围。把节点本身挂在 scope 上，
     dbgRun 才判断得了「这一跑会不会真的拨动现场」。 */
  if(t==='sig'){const r=sigById(id);
    return r?{lv:1,k:sigKn(r.g),n:r.g.n,sig:r.g,seg:r.seg}:null;}
  return null;   /* 没选中节点就没有节点级范围 */
}
/* F5 与旧调用保持原语义：跑最具体的那一档 */
function runScope(){ return nodeScope()||treeScope(); }
/* 连续执行的范围恒为全流程，不跟随选中；执行才按选中范围 */
function dbgRun(mode,which){
  if(DBG.running)
    return toast(PRODMODE?'正在生产，先停止':`正在${DBG.running==='loop'?'连续测试运行':'检测'}，先停止`);
  const pick = which==='tree'?treeScope() : which==='node'?nodeScope() : runScope();
  const sc=mode==='loop'?{lv:5,k:'全流程',n:'全流程'}:pick;
  if(!sc)return toast('先选中要跑的图像');
  if(!DOCKOPEN&&!DOCKRUN){DOCKOPEN=true;applyDockH();} DOCKRUN=1;   /* 只在第一次运行时自动展开（用户 2026-10-14），之后由用户自己收放 */
  /* §88 单跑一个发送节点 = 真的拨动现场电磁阀。「调试执行不写外部」默认开着，
     它在这里才第一次有了真正的拦截对象——§86 做它的时候原型里根本没有可拦的写出动作。
     延时不对外，变量是软件内部的，都不拦；只拦目标在「对外」那一组的。 */
  /* 只拦发送。接收是读，读一个 DI 或寄存器不会改变现场任何东西——
     开关的名字就叫「不写外部」，拦住读操作等于跟自己的名字打架（§56②）。
     这是断言抓出来的：接收节点被拦下，超时那条分支根本走不到。 */
  if(mode==='once'&&sc.sig&&sc.sig.k==='send'&&tgtGrp(sc.sig.tgt)==='out'&&DBG.noExt){
    DBG.running=null;DBG.rn='';
    return toast(`「${sc.sig.n}」没有执行 · 测试选项设为「不向 PLC / IO 输出」`);
  }
  if(mode==='once'&&sc.sig&&sc.sig.k==='recv'&&sc.sig.tmo){
    /* 需求 198：Fail = 检测没能完成——图像不完整、定位失败、算法异常、**超时**。
       需求 200：NG 是产品的问题，Fail 是系统的问题。等不到信号是设备问题。
       调试台上没有真设备，填了超时的接收节点必然等不到——这不是假装，是如实。 */
    DBG.running=null;DBG.rn='';
    sc.sig.v='Fail';sc.sig.ms=+sc.sig.tmo||0;
    delete STALE[sc.sig.id];
    renderAll();syncDock();renderCamMatrix();
    return toast(`「${sc.sig.n}」等待超时 ${sc.sig.tmo} ms · 本图判 Fail（系统问题，不是产品不良）`);
  }
  if(mode==='once'&&DBG.mode==='online'&&sc.lv>=4)
    toast(`等待电控请求采图 · ${sc.n}`);
  if(sc.lv>=2)Object.keys(STALE).forEach(k=>delete STALE[k]);
  else delete STALE[S.sel.id];
  DBG.running=mode;DBG.rn=sc.n;DBG.count=mode==='loop'?0:DBG.count;
  if(mode==='loop'&&DBG.mode==='offline'){   /* 离线的数据是有限的：跑到批次末件自停 */
    RPDONE={};DBG.hist=1;renderAll();syncDock();renderCamMatrix();
    toast(`连续测试运行，本批 ${DBG.histN} 件`);
    return rpTick();
  }
  if(mode==='loop'&&LOCAL){renderAll();toast(`连续测试运行，本地 ${LOCAL.files.length} 张`);return localTick();}
  renderAll();
  if(mode==='once')setTimeout(()=>{
    if(DBG.running!=='once')return;          /* 已被停止 */
    DBG.running=null;DBG.rn='';
    if(sc.lv>=4)DBG.count++;
    if(LOCAL)LOCAL.done[LOCAL.i]=['OK','NG','OK','OK','Fail'][(LOCAL.i*7)%5];
    else if(DBG.mode==='online')liveAdd();
    else if(DBG.mode==='offline'&&sc.lv>=4)rpRun(DBG.hist);
    renderAll();syncDock();renderCamMatrix();
    toast(sc.lv<4 ? `已测试${sc.k}「${sc.n}」`
      : sc.lv===4 ? `${sc.n} 测试完成。单工位结果不进调试输出，看画布与调试信息`
      : `全流程测试完成 · ${modeText()}${DBG.noExt?' · 不向外输出':''}`);},380);
  else{toast(`${PRODMODE?'开始生产':'连续测试运行，实时持续采图并检测'}${DBG.noExt?' · 不向外输出':''}`);if(!PRODMODE)setTimeout(liveTick,500);}
}
/* 逐件回放：跑一件、填一行、往下走，到末件自动停 */
function rpTick(){
  if(DBG.running!=='loop'||DBG.mode!=='offline')return;
  const v=rpRun(DBG.hist);
  DOUT=DOUT.concat(genRows(1,DOUT.length*97+DBG.hist,'hist')
    .map(r=>({...r,no:DOUT.length+1})));
  DBG.count=DOUT.length;
  /* §86 遇 NG 暂停：停在出问题的那一件上。停下来的位置本身就是信息，
     所以不往下跑，也不跳回批次开头。 */
  if(DBG.pauseNG&&v!=='OK'){
    DBG.running=null;DBG.rn='';
    renderAll();syncDock();renderCamMatrix();
    return toast(`第 ${DBG.hist} 件 ${v} · 已按「遇 NG 暂停」停住`);
  }
  renderAll();syncDock();renderCamMatrix();
  if(DBG.hist>=DBG.histN){
    const st=rpStat();DBG.running=null;DBG.rn='';
    renderAll();syncDock();renderCamMatrix();
    return toast(`本批 ${DBG.histN} 件跑完 · 改善 ${st.better} 件 / 恶化 ${st.worse} 件`);
  }
  DBG.hist++;
  setTimeout(rpTick,160);
}
/* 本地目录逐张检测：从当前这张起往下，到末张自停 */
function localTick(){
  if(DBG.running!=='loop'||!LOCAL)return;
  const v=LOCAL.done[LOCAL.i]=['OK','NG','OK','OK','Fail'][(LOCAL.i*7)%5];DBG.count++;
  if(DBG.pauseNG&&v!=='OK'){DBG.running=null;DBG.rn='';renderAll();return toast(`第 ${LOCAL.i+1} 张 ${v} · 已按「遇 NG 暂停」停住`);}
  if(LOCAL.i>=LOCAL.files.length-1){DBG.running=null;DBG.rn='';renderAll();return toast(`本地 ${LOCAL.files.length} 张检测完`);}
  LOCAL.i++;renderAll();setTimeout(localTick,200);
}
/* 停止是全局的：任何执行卡住都能打断，包括单个节点 */
function dbgStop(){
  if(!DBG.running)return toast('当前没有在运行');
  const wasLoop=DBG.running==='loop', n=DBG.count, nm=DBG.rn||'全流程';
  DBG.running=null;DBG.rn='';renderAll();
  toast(wasLoop?`已停止 · 本轮 ${n} 件`:`已中断「${nm}」`);
}

/* 顶部不再有一条可切换的全局命令 tab（调试/工具/视图）——那三个 tab 本质是
   Office 那种「命令面板选择器」，跟下面操作区是哪个业务领域是两回事，容易让人以为点了会换页。
   现在按 S.rail 直接分发：进哪个业务页，工具条就只装那个业务页自己的东西，不用切、不会串。
     检测编辑：原「调试」的执行态命令 + 原「视图·画布」的画布命令 + 「模型库」（建方案要挑的资源）
     输出设置：原「工具·数据」的报表/统计类命令
     设备配置 / 机台结构：没有需要常驻的命令，工具条留空
   生产页不用这条工具条——它的操作入口在 #prodhead（见 applyRailMode 附近）。 */
const stubBtns=list=>'<div class="rrow">'+
  list.map(x=>`<div class="rbtn">${I(x[0])}<span>${x[1]}</span></div>`).join('')+'</div>';

function renderTbDispatch(){
  renderTbBar();                  /* 工具箱栏只在检测编辑页出现 */
  /* §77 右段（三个数据入口）只在检测编辑页出现。放在这里统一清，
     别指望 renderInspRibbon 里那一份——它在别的页根本不会被调到。 */

  if(S.rail==='out'){renderOutRibbon();return;}

  $('#rgroups').innerHTML='';     /* 设备配置 / 机台结构：树头的新增/复制/重命名/删除已经够用 */
}

/* 检测编辑左栏：来源切换 + （仅本地图像时）逐件导航。
   编辑态的「执行/停止」不在这里——它跑的范围跟着树上的选中走，
   执行/停止已挪到顶栏，跟图像来源用一条竖分割线隔开——同属「怎么跑」这一类。
   原来还挂了「调试输出（清空/导出）」「画布（适应窗口/1:1/显示叠加）」「资源（模型库）」三组，
   这次按要求去掉：
     · 画布那三个和模型库本来就是没接线的占位按钮，摆在常驻工具栏上是白占地方
     · 清空调试输出在工具坞里右键菜单已经有了（dclear），这里是第二个入口，重复
   删掉之后这条栏只剩「跟当前执行状态有关」的东西，职责比之前干净。 */
function renderInspRibbon(){
  /* 在线/离线原来是个横向两段的胶囊切换（.rseg），跟这条栏里其它按钮长得完全是两回事。
     改成跟上下那些按钮同一个骨架的两个按钮（上图标下文字），互斥关系靠选中态表达：
     同一时刻只有一个带 .on。点击行为一个字没改，还是 [data-dsrc] 那条绑定。 */
  const sb=(m,ic,tx)=>`<div class="rbtn${DBG.mode===m?' on':''}" data-dsrc="${m}">${I(ic)}<span>${tx}</span></div>`;
  const rb=(a,ic,tx,cls)=>`<div class="rbtn ${cls||''}" data-dbg="${a}">${I(ic)}<span>${tx}</span></div>`;
  /* 两个来源按钮不挂组名：它们自己就是「实时图像 / 本地图像」，
     上面再顶一个「图像来源」是同一件事说两遍。
     逐件导航只在本地图像下才有意义——实时图像是等电控按节拍送图，没有「上一件」可翻；
     2026-10-08 起实时图像下整组禁用（不隐藏），工具条长度不变。 */
  const isOff=DBG.mode==='offline';
  const sc=runScope();
  const rbt=(a,ic,tx,ok,tip)=>`<div class="rbtn${tx.length>4?' wd':''}${ok?'':' dis'}" data-dbg="${a}" title="${tip}">${I(ic)}<span>${tx}</span></div>`;
  /* §77 连续执行与停止放工具条最左，双倍宽主按钮。
     它们是全局的：连续执行恒为全流程、不跟随选中（需求 6.2），停止能打断任何执行。
     正因为不跟随选中，它们不该挨着「执行」——那个是跟着树/节点栏的选中走的。 */
  const dbt=(a,ic,tx)=>`<div class="rbtn" data-open="${a}" title="${tx}">${I(ic)}<span>${tx}</span></div>`;
  /* §86 执行选项。跟连续执行/停止同一组——都在回答「怎么跑」，所以不加分割线。
     需求 6.1 写死了「范围由选中对象决定，不设独立的范围选择器」，
     所以这个菜单里永远不会出现执行范围。它只放「跑的时候怎么处置后果」。
     勾选态、按钮 .on、状态栏标记读的都是 DBG 上那一份，不另存。 */
  const OPTS=TOPTS;
  const optBtn=()=>{
    const anyOn=OPTS.some(o=>DBG[o[0]]);
    return `<div class="ropt">
      <div class="rbtn${S.dd==='opt'?' open':''}" data-rdd="opt"
        title="测试选项${anyOn?'（已启用 '+OPTS.filter(o=>DBG[o[0]]).length+' 项）':''}">
        <div class="roptic">${I('adjustments')}${anyOn?'<i class="rdot"></i>':''}</div>
        <span>测试选项</span></div>
      ${S.dd!=='opt'?'':`<div class="camdd">${OPTS.map(o=>
        `<div class="camop${DBG[o[0]]?' on':''}" data-ropt="${o[0]}">
          <span class="cbx">${DBG[o[0]]?I('check'):''}</span>
          <span class="cn">${o[1]}</span></div>`).join('')}
        </div>`}
      ${S.dd==='opt'?'<div class="camddmask" data-ddclose></div>':''}</div>`;};
  /* 工具条按工作顺序排（用户 2026-10-08；10-09 起「看哪张图」移到最左）：① 看哪张图 → ② 图像从哪来 → ③ 数据入口；④ 执行组在最右端（#rextra）。
     ① 组常驻：实时图像下「批次回放 / 本地目录 / 上一件 / 下一件」禁用而不隐藏，工具条长度不随模式变。
     ③ 组是唯一的执行入口：画布标题栏不再放执行 / 停止 / 翻页，全页只有一个停止。 */
  const hasPrev=LOCAL?LOCAL.i>0:DBG.hist>1, hasNext=LOCAL?LOCAL.i<LOCAL.files.length-1:DBG.hist<DBG.histN;
  const pn=LOCAL?['上一文件','下一文件']:['上一件','下一件'];
  /* 工位 / 相机 / 图像放最左（用户 2026-10-09）：先定「看哪张图」，再选图像从哪来 */
  $('#rgroups').innerHTML=cfgRow();
  renderIcons($('#rgroups'));bindCfgRow();
  /* 右段放执行组（用户 2026-10-08：执行相关放最右侧）；数据入口跟在当前图像之后 */
  const rx=$('#rextra');
  if(rx){
    rx.innerHTML = (S.rail==='insp'&&!PRODMODE)
      ?     `<div class="rrow">
      ${optBtn()}
      ${rbt('stop','stop-circle','停止',!!DBG.running,DBG.running?'停止  (Esc)':'没有正在进行的检测')}
      <div class="rbtn wd${DBG.running?' dis':''}" data-dbg="once" data-scope="tree" title="${DBG.running?'检测进行中':'实时：采一张并检测；本地 / 批次：检测画布上这张  (F5)'}">${I('play-circle')}<span>单次测试运行</span></div>
      ${rbt('loop','autorenew','连续测试运行',!DBG.running,DBG.running?'检测进行中':'从当前这张起，按图像栏逐张检测；实时时持续采图并检测  (Ctrl+F5)')}
</div>`
      : '';
    renderIcons(rx); bindDbg(rx);
  }
  bindDbg($('#rgroups'));
  /* bindFilters() 的选择器锁在 #tree 上，够不到工具条，这里自己绑一份。
     S.dd 是全局「哪个下拉开着」，跟树上的筛选共用——开一个自动关另一个，不另立状态。 */
  $$('#rgroups [data-rdd],#rextra [data-rdd]').forEach(el=>el.onclick=()=>{
    S.dd=(S.dd===el.dataset.rdd)?null:el.dataset.rdd;renderTbDispatch();});
  $$('#rgroups [data-ddclose],#rextra [data-ddclose]').forEach(el=>el.onclick=()=>{S.dd=null;renderTbDispatch();});
  $$('#rgroups [data-ropt],#rextra [data-ropt]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.ropt;DBG[k]=!DBG[k];renderTbDispatch();applyDockH();});
  $$('#rgroups [data-src]').forEach(b=>b.onclick=()=>{if(b.classList.contains('dis'))return;
    if(b.dataset.src==='rp'){replayDlg();}else localDlg();});
}

/* ---- 工位 / 相机 两级筛选 ----
   原来是结构树顶上两条整宽下拉行（各 32px 高，占掉树 80px）。挪到工具条上。
   normFilters() 是纯计算，renderTbDispatch 和 renderTree 都调它——两边必须看到同一份
   筛选状态，而 renderAll() 里 renderTbDispatch 先跑，逻辑留在 renderTree 里会慢一帧。 */
function normFilters(){
  if(!Array.isArray(S.treests))S.treests=[];
  if(!Array.isArray(S.treecams))S.treecams=[];
  /* 选中项所属的相机与工位始终可见 */
  const ownCam = S.sel.t==='cam'?S.sel.id
    : S.sel.t==='img'?((IMGS.find(x=>x.id===S.sel.id)||{}).cam)
    : S.sel.t==='el'?((imgOfEl(S.sel.id)||{}).cam)
    : S.sel.t==='sch'?((schInfo(S.sel.id)||{}).cam):null;
  if(ownCam){
    const oc=camOf(ownCam);
    if(oc && S.treests.length && !S.treests.includes(String(oc.st)))S.treests=[String(oc.st)];
    if(S.treecams.length && !S.treecams.includes(ownCam))S.treecams=[ownCam];
  }
  /* 相机候选跟随工位收窄；越界的已选相机自动剔除 */
  const stAll=S.treests.length===0;
  const camPool=stAll?CAMS:CAMS.filter(c=>S.treests.includes(String(c.st)));
  S.treecams=S.treecams.filter(id=>camPool.some(c=>c.id===id));
  const camAll=S.treecams.length===0;
  return {stAll,camPool,camAll,
    shown: camAll?camPool:camPool.filter(c=>S.treecams.includes(c.id))};
}


/* 结构树顶部的筛选：它改的是树里显示哪些工位/相机，作用对象和结果都在树里，
   所以贴着树头，不在工具条上（工具条只该放页面级的东西）。
   树宽 280，两列各 ~132，标签写得下完整的「全部工位 / 全部相机」。 */
function filterBtns(){
  const {stAll,camPool,camAll}=normFilters();
  const stLabel = stAll?'全部工位'
    :(S.treests.length===1?`工位${S.treests[0]} ${(STATIONS.find(x=>String(x.no)===S.treests[0])||{}).name}`
      :`已选 ${S.treests.length} 个工位`);
  const camLabel = camAll?'全部相机'
    :(S.treecams.length===1?(camOf(S.treecams[0])||{}).name:`已选 ${S.treecams.length} 台`);
  const one=(kind,ic,label,on,opts,allOn,allText)=>`<div class="rfil">
    <div class="tfb${on?' on':''}${S.dd===kind?' open':''}" data-dd="${kind}"
      title="${allText}">${I(ic)}<span class="cv">${label}</span>${I('chevron-down','font-size:var(--fs)')}</div>
    ${S.dd===kind?`<div class="camdd">
      <div class="camop${allOn?' on':''}" data-op="${kind}:*">
        <span class="cbx">${allOn?I('check'):''}</span><span class="cn">${allText}</span></div>
      <div class="camddsep"></div>
      ${opts.map(o=>`<div class="camop${o.on?' on':''}" data-op="${kind}:${o.v}">
        <span class="cbx">${o.on?I('check'):''}</span><span class="cn">${o.n}</span></div>`).join('')}
      </div>`:''}</div>`;
  return `<!-- §76 全流程回到结构树筛选行最左。§54 警告过它跟筛选并排会撞语义
         （筛选管「树上看得见哪些」，全流程管「执行跑多大」），用户两次都要它在这儿。
         用竖分割线把它和两个筛选隔开，并用选中态表达它是范围不是筛选。 -->
    <div class="tall${S.sel.t==='all'?' on':''}" id="tree-all"
      title="全流程（执行范围设为整条流程）">${I('sitemap')}</div>
    <span class="tallsep"></span>
    ${one('st','cpu',stLabel,!stAll,
      STATIONS.map(st=>({v:st.no,n:`工位${st.no} ${st.name}`,on:S.treests.includes(String(st.no))})),
      stAll,'全部工位')}
    ${one('cam','camera',camLabel,!camAll,
      camPool.map(c=>({v:c.id,n:c.name,on:S.treecams.includes(c.id)})),
      camAll,'全部相机')}`
    /* opt 的遮罩由工具条那边自己渲染，这里再来一层会叠两个，点一次只关掉一个 */
    + (S.dd&&S.dd!=='opt'?'<div class="camddmask" data-ddclose></div>':'');
}
function bindFilters(){
  const ta=$('#tree-all');
  if(ta)ta.onclick=()=>{S.sel={t:'all'};S.bhelp=null;renderAll();syncDock();};
  $$('#tree [data-dd]').forEach(el=>el.onclick=()=>{
    S.dd=(S.dd===el.dataset.dd)?null:el.dataset.dd;renderTree();});
  $$('#tree [data-ddclose]').forEach(el=>el.onclick=()=>{S.dd=null;renderTree();});

/* 输出设置：报表/统计类命令，跟这一页本来管的「数据往哪儿出」是同一个域 */

/* ---------- 整机运行（原型模拟）：各工位依次运行，结果标在工位卡片上 ---------- */
let MRUN={run:0,tm:{},n:{},res:{}};
/* 机台测试运行：各工位并行，各自按节拍循环（产品在工位间流转，工位之间不互相等待） */
function mrunStart(mode){
  if(MRUN.run)return;
  Object.assign(MRUN,{run:mode,tm:{},n:{},res:{}});
  STATIONS.filter(x=>viewsOf(x).length).forEach(st=>{MRUN.n[st.no]=0;mrunStation(st);});
  mrunPaint();renderMachRibbon();renderRunStatus();
}
function mrunStation(st){
  const t0=Date.now(), d=300+viewsOf(st).length*90+(st.no*37)%160;
  MRUN.res[st.no]={s:'run'};mrunPaint();
  MRUN.tm[st.no]=setTimeout(()=>{if(!MRUN.run)return;
    const v=((st.no*3+MRUN.n[st.no])%7===5)?'NG':'OK';MRUN.n[st.no]++;
    MRUN.res[st.no]={s:v==='OK'?'ok':'ng',v,ms:Date.now()-t0};mrunPaint();
    if(v!=='OK'&&DBG.pauseNG&&MRUN.run===2)return mrunEnd(`工位${st.no} ${st.name} NG，已按「遇 NG 暂停」停住`);
    if(MRUN.run===2){MRUN.tm[st.no]=setTimeout(()=>MRUN.run&&mrunStation(st),400);return;}
    if(Object.values(MRUN.res).every(r=>r.s!=='run'))mrunEnd('测试运行完成');},d);
}
function mrunEnd(msg){Object.values(MRUN.tm).forEach(clearTimeout);MRUN.tm={};MRUN.run=0;mrunPaint();if(S.rail==='mach'){renderMachRibbon();renderRunStatus();}if(msg)toast(msg);}
function mrunStop(){if(!MRUN.run)return;mrunEnd('已停止测试运行');}
function mrunPaint(){
  $$('#cbody .mst[data-mst]').forEach(el=>{const r=MRUN.res[el.dataset.mst], w=el.querySelector('.mrun');if(!w)return;
    el.classList.toggle('mrunning',!!r&&r.s==='run');
    w.className='mrun'+(r?' '+r.s:'');w.textContent=!r?'—':r.s==='run'?'运行中…':`${r.ms} ms`;});
}

function bindDbg(root){
  $$('[data-dsrc]',root).forEach(el=>el.onclick=()=>{

    /* §79 切到本地图像时，顺手把底坞翻到「图像源」——那一页是本批有哪些件、
       现在在第几件。只在这一次点击里执行，之后用户想切到别的页签就切，不再锁。
       §55 曾撤掉过一条同位置的机制，但那条是「引导」：为了弥补选源按钮离得远。
       选源按钮如今就在旁边，这条不是引导，是把刚载入的那张表摆到眼前。 */

  $$('[data-dbg]',root).forEach(el=>el.onclick=()=>{

    if(a==='stop'){dbgStop();return;}
    if(a==='replay'){replayDlg();return;}
    if(a==='clear'){DBG.count=0;renderAll();toast('调试输出已清空');return;}
    if(a==='export'){toast('调试输出已导出');return;}
    if((a==='prev'||a==='next')&&LOCAL){   /* 本地源下翻的是文件 */
      const j=LOCAL.i+(a==='prev'?-1:1);
      if(j<0||j>=LOCAL.files.length)return toast(a==='prev'?'已经是第一张':'已经是最后一张');
      LOCAL.i=j;renderAll();syncDock();renderCamMatrix();
      return toast(`${LOCAL.files[j]} · ${j+1}/${LOCAL.files.length}`);}
    if(a==='prev'||a==='next'){
      const n=a==='prev'?DBG.hist-1:DBG.hist+1;
      if(n<1||n>DBG.histN)return toast(a==='prev'?'已经是第一件':'已经是最后一件');
      gotoHist(n);                          /* 等同于在离线批次表上下移一行 */
      toast(`已载入 ${histRec().sn} · ${DBG.hist}/${DBG.histN}`);return;}
  });
}

/* 画布上的离线标记 + 逐件翻图 */
/* 离线批次里的一件。本次判定只有跑过才有 —— 没跑就写上判定，
   这张表就成了假的进度视图，也就看不出连跑到哪一件了。 */
let RPDONE={};                 /* 件号 → 本次判定 */
const rvIdx=i=>DBG.rvList?DBG.rvList[i-1]:i;   /* 回放第 i 件对应的批次内产品序号 */
function rpRec(i){
  const r=histRec(i), h=(rvIdx(i)*2654435761)>>>0;
  const v0=['OK','NG','OK','Fail','NG','OK','OK','NG'][h%8];
  return {i,sn:r.sn,t:r.t,v0,v1:RPDONE[i]||''};
}
/* 切到某一件：画布换成这一件的图，树上没选图就选第一张 */
function gotoHist(i){
  DBG.hist=Math.max(1,Math.min(DBG.histN,i));
  S.rail='insp';
  if(!imgFromSel())S.sel={t:'img',id:(PSCOPE?selImgs():IMGS)[0].id};
  renderAll();syncDock();renderCamMatrix();
}
/* 重跑这一件，产生本次判定 */
function rpRun(i){
  const h=((i*40503)^0x5bf03635)>>>0, r=rpRec(i);
  RPDONE[i]=(r.v0!=='OK'&&h%3===0)?'OK':(r.v0==='OK'&&h%9===0)?'NG':r.v0;
  return RPDONE[i];
}
const rpStat=()=>{const k=Object.keys(RPDONE);
  return {done:k.length,
    better:k.filter(i=>rpRec(+i).v0!=='OK'&&RPDONE[i]==='OK').length,
    worse: k.filter(i=>rpRec(+i).v0==='OK'&&RPDONE[i]!=='OK').length};};
function histRec(n){return histAbs(rvIdx(n||DBG.hist));}
function histAbs(i){
  const t=new Date(2026,7,25,9,31,4,140).getTime()+(i-1)*1240, d=new Date(t);
  return {sn:`P-26081${String(10237+i-1).padStart(5,'0')}`,
    t:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${
       String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`};
}

/* ---- 本地文件夹快速测试 ----
   一个文件夹里是散图，没有 SN、没有相机归属，拼不成「件」，

   给当前这个图位换一个源，逐张跑这一张图的方案。不组件、不出整件判定、不进生产库。 */
let LOCAL=null;                     /* {dir, files:[], i, img} */

/* ---- 定位 ----
   一张图可以有多个定位方案。第一个是默认坐标系，后建的元素与方案默认引用它，
   ROI 随这个坐标系仿射变换。一个定位都没有，就等于不定位，全部按图像绝对坐标执行。
   定位方式本身是完整方案，ROI 是它自己的参数，不拆成独立元素节点 ——
   普通元素的 ROI 被定位摆正，定位再去用元素就成了循环。 */
const LOCM={
 '模板匹配': {i:'target'},        '边缘基准': {i:'border-corners'},
 '两线交点': {i:'crosshair'},     '三点圆心': {i:'circle-dashed'},
 '跟随定位': {i:'link'},          '点云基准面':{i:'flatness'}

/* 浮动工具条贴到对象左上角。
   SVG 是 preserveAspectRatio="xMidYMid meet"，画面在容器里是带黑边的，
   所以不能直接按容器百分比定位——要先算出这一帧的缩放和黑边。 */
function placeCvTb(){
  const tb=$('#cvtb'), box=$('#cvwrap');
  if(!tb||!box||!SELTAG)return;
  const W=box.clientWidth, H=box.clientHeight;
  if(!W||!H)return;                       /* 还没排版（或 jsdom 无布局）：保持默认位置 */
  const s=Math.min(W/1200,H/820);
  const ox=(W-1200*s)/2, oy=(H-820*s)/2;
  tb.style.left=Math.max(4,ox+SELTAG.x*s)+'px';
  tb.style.top =Math.max(4,oy+SELTAG.y*s-40)+'px';   /* 压在标签上方 */
}
/* 画布上能对当前对象做的事。右键菜单和浮动工具条用同一份，避免两处入口给出不同能力。 */
function cvActions(){
  const im=curImg(), lk=schemeLocked(im);
  const R=lk?'dis':'';
  return [['复制到其他图像','copy','cvcopy',R],
          ['删除','trash','cvdel',R?'dis':'del','Del']];
}
function doCvAction(a){
  const im=curImg();
  if(a==='cvlock'){const id=schemeHost(im).id;
    SLOCK[id]=!SLOCK[id];
    DIRTY++;   /* 锁定状态要存进工程，否则重启就没了，防误改就不成立 */
    toast(SLOCK[id]?'方案已锁定，调参不会被误改':'方案已解锁');
    renderAll();syncDock();return;}
  if(schemeLocked(im))return toast('方案已锁定，先解锁再改');
  if(a==='cvcopy')copyNodeDlg();
  else if(a==='cvdel'){if(selIsNode())delElement();else toast('先选中一个节点');}
}
function bindCvTb(){
  $$('#cvtb [data-cv]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(el.classList.contains('dis'))return;
    const a=el.dataset.cv;
    if(a==='more'){const r=el.getBoundingClientRect();
      ctxMenu(r.left/SCALE,(r.bottom+4)/SCALE,cvActions());

/* ctxMenu 的点击路由是一张固定动作表，画布这几个不在表里，这里自己接一次 */
function bindCvMenu(){
  const c=$('#ctx');
  c.querySelectorAll('[data-a]').forEach(el=>{
    if(!/^cv/.test(el.dataset.a))return;
    el.onclick=()=>{c.classList.remove('on');doCvAction(el.dataset.a);};});

/* 底栏的坐标与取色：真实产品读像素，原型按坐标算一个稳定的伪色 */
function bindCvProbe(){
  const box=$('#cvwrap'); if(!box)return;
  const xy=$('#cvxy'), rgb=$('#cvrgb'), sw=$('#cvsw');
  box.onmousemove=e=>{
    const r=box.getBoundingClientRect();
    if(!r.width||!r.height)return;
    const x=Math.round((e.clientX-r.left)/r.width*1440);
    const y=Math.round((e.clientY-r.top)/r.height*1080);
    const g=(v,s)=>Math.max(0,Math.min(255,Math.round(
      118+56*Math.sin((x*.021+y*.017)+s)+18*Math.sin(y*.09+s*2))));
    const c=[g(x,0),g(x,.7),g(x,1.4)];
    xy.textContent=`X ${x}　Y ${y}`;
    rgb.textContent=`RGB ${c.join(', ')}`;
    sw.style.background=`rgb(${c.join(',')})`;
    sw.style.visibility='visible';};
  box.onmouseleave=()=>{
    xy.textContent='X —　Y —';rgb.textContent='RGB —';sw.style.visibility='hidden';};
}

/* ================= 工位页（用户 2026-10-09 方案 A） =================

const STRULE={fixed:'多台相机拍同一件产品',mq:'每台相机拍一件产品',fly:'一台相机依次拍多件产品，每张图像一件',laser:'激光扫描一件产品'};
const STILL={
 fixed:'<svg viewBox="0 0 200 112"><path class="v" d="M58 30 L92 70M142 30 L108 70"/><rect class="c" x="38" y="10" width="40" height="22" rx="4"/><circle class="c" cx="58" cy="21" r="5"/><rect class="c" x="122" y="10" width="40" height="22" rx="4"/><circle class="c" cx="142" cy="21" r="5"/><rect class="p" x="76" y="66" width="48" height="24" rx="4"/></svg>',

 fly:'<svg viewBox="0 0 200 112"><rect class="c" x="18" y="10" width="40" height="22" rx="4"/><circle class="c" cx="38" cy="21" r="5"/><path class="m" d="M38 32 V44 H178 m-6 -5 l6 5 -6 5"/><path class="v" d="M38 44 V76M72 44 V76M106 44 V76M140 44 V76M174 44 V76"/><rect class="p" x="26" y="76" width="24" height="20" rx="3"/><rect class="p" x="60" y="76" width="24" height="20" rx="3"/><rect class="p" x="94" y="76" width="24" height="20" rx="3"/><rect class="p" x="128" y="76" width="24" height="20" rx="3"/><rect class="p" x="162" y="76" width="24" height="20" rx="3"/></svg>',

const stIcon=st=>'st-'+(STILL[st.type]?st.type:'fixed');
/* 图像所属穴位：定拍 / 激光＝1；MQ＝相机序号；飞拍＝图像序号 */
function holeOf(st,im){

  if(m==='cam')return CAMS.filter(c=>c.st===st.no).findIndex(c=>c.id===im.cam)+1;
  if(m==='shot')return Math.floor(imgsOf(im.cam).indexOf(im)/shotN(camOf(im.cam)))+1;

}
/* 飞拍图像名随穴位顺延：只改仍是「穴N」的名字，用户改过的不动 */
function flyRename(st){

/* 工位缺哪些配置，按分节归类。判定地址允许留空（留空＝本工位不输出结果） */
function stIssues(st){
  const n=batchN(st), bad=a=>!okAddr(a), r={hs:[],hole:[],cap:[]};
  if(hsOn(st)){const k=['req','ack','done','fin'].filter(k=>bad(st.sig[k])).length;if(k)r.hs.push(`${k} 个地址未填或格式错误`);}

  {const k=Array.from({length:n},(_,i)=>(st.sig.res||[])[i]).filter(a=>a&&bad(a)).length;if(k)r.hole.push(`${k} 个判定地址格式错误`);}
  if(!CAMS.some(c=>c.st===st.no))r.cap.push('未选用相机');

}

function holeBlock(st){

/* ================= 视角 × 穴位（用户 2026-10-09 对象模型） =================
   一个工位＝一张「视角（行）× 穴位（列）」表：
     视角＝同一种拍法，一行共用一套检测方案；穴位＝一次进站的一件产品；格＝一次采集（曝光、增益、AOI 与算法参数微调）。
   由现有「相机位 → 图像」推导，不另存：
     定拍 / 线激光：每张图一个视角，穴位固定 1
     MQ：第一台相机的各图为视角（各相机同序号＝同一视角），每台相机一个穴位
     飞拍：只有一个视角，每张图一个穴位
   一行的检测方案挂在「宿主」上（schemeHost：MQ＝第一台相机的同序号图，飞拍＝第一张图）。
   宿主变化（删除、移动第一台相机或第一穴）时，用 moveScheme 把方案搬到新宿主。 */
function viewsOf(st){
  const cams=stCams(st), m=prodMap(st);
  if(!cams.length)return [];
  if(m==='shot'){const c=cams[0];return imgsOf(c.id).slice(0,shotN(c)).map(h=>({key:h.id,host:h,cam:c}));}
  if(m==='cam')return imgsOf(cams[0].id).map(im=>({key:im.id,host:im,cam:null}));
  return cams.flatMap(c=>imgsOf(c.id).map(im=>({key:im.id,host:im,cam:c})));
}
/* 不用「视角」概念（用户 2026-10-12）：图像名称即拍的哪一面。飞拍各穴的图按穴位自动命名（穴1…），采集节点统称「采集图像」 */
const viewName=(st,v)=>prodMap(st)==='shot'?'采集图像':v.host.name;
/* 一行内的各格（采集），按穴位顺序 */
function rowCells(host){
  const c=camOf(host.cam); if(!c)return [host];
  const st=stOf(c), m=prodMap(st);
  if(m==='shot'){const ims=imgsOf(c.id), N=shotN(c), k=ims.indexOf(host)%N;return ims.filter((_,j)=>j%N===k);}
  if(m==='cam'){const j=imgsOf(c.id).indexOf(host);return stCams(st).map(x=>imgsOf(x.id)[j]).filter(Boolean);}
  return [host];
}
/* 一行的方案从旧宿主搬到新宿主 */
function moveScheme(a,b){
  if(!a||!b||a===b)return;
  ['els','items','locs','flow'].forEach(k=>{if(a[k]&&a[k].length){b[k]=a[k];a[k]=[];}});
  if(SCH[a.id]){SCH[b.id]=SCH[a.id];delete SCH[a.id];}
  if(a.cam!==b.cam)(b.items||[]).forEach(k=>{if(IMPL[k+'@'+a.cam]&&!IMPL[k+'@'+b.cam])IMPL[k+'@'+b.cam]=IMPL[k+'@'+a.cam];});
}
const hostsOf=st=>viewsOf(st).map(v=>v.host);
/* 只用于穴位换序（MQ 换相机顺序、飞拍换穴位顺序）：视角不变，宿主换成了另一格 */
function rehost(st,before){if(prodMap(st)==='one')return;hostsOf(st).forEach((h,i)=>{if(before[i]&&before[i]!==h)moveScheme(before[i],h);});}
function swapImgs(a,b){const ga=IMGS.indexOf(a),gb=IMGS.indexOf(b);IMGS[ga]=b;IMGS[gb]=a;renumberImgs(a.cam);if(a.cam!==b.cam)renumberImgs(b.cam);}
function dropImg(im){(im.els||[]).forEach(e=>delete ELS[e]);(im.items||[]).forEach(k=>delete ITEMS[k]);delete SCH[im.id];IMGS.splice(IMGS.indexOf(im),1);}
const lb2=(attr,a,ic,tx,ok,why)=>`<button class="lbtn${ok?'':' dis'}" ${attr}="${a}"${!ok&&why?` title="${why}"`:''}>${I(ic)}${tx}</button>`;
const devOpts=(cur,dis)=>Object.keys(DEVS).filter(d=>!DEVS[d].laser).map(d=>`<option value="${d}"${d===cur?' selected':''}${dis&&dis(d)?' disabled':''}>${DEVS[d].n}</option>`).join('');

/* MQ 工位内，各相机的同序号图像是同一个视角，名字联动。
   定拍工位各相机拍不同的面，序号相同不构成视角，不联动 */
const viewLinked=st=>st.rel==='lane' && prodMap(st)!=='shot'
  && CAMS.filter(c=>c.st===st.no).length>1;
/* 选用相机：直接加一块，设备默认取本工位还没用的第一台，在块头的选择框里换（新增不弹窗、不用菜单） */
const freeDev=st=>Object.keys(DEVS).find(d=>!camsOfDev(d).some(c=>c.st===st.no));
function camPick(st){
  const d=freeDev(st); if(!d)return;
  const id=newCamId(), tp=STTYPE[st.type]||{}, peers=CAMS.filter(x=>x.st===st.no);
  CAMS.push(bindDev({id,dev:d,st:st.no,mode:tp.mode||'static'}));
  /* MQ 照第一台相机的视角逐张建；飞拍建「穴1」；其余建一张 */
  const tpl=st.rel==='lane'&&peers[0]&&tp.mode!=='prod'?imgsOf(peers[0].id):[];
  if(tpl.length)tpl.forEach(t=>{imgAdd(id);const ls=imgsOf(id);ls[ls.length-1].name=t.name;if(t.bg)ls[ls.length-1].bg=t.bg;});
  else{imgAdd(id);if(tp.mode==='prod')imgsOf(id)[0].name='穴1';}
  S.imgrow=null;syncSigLen(st);DIRTY++;
}
/* 产品地址按载体序号存放（st.sig.pid / res 第 i 项＝第 i 件产品）。MQ 的相机、飞拍的图像移动或增删时，地址跟着载体走 */
function sigSwap(st,i,j){['pid','res'].forEach(k=>{const a=st.sig[k]||[];[a[i],a[j]]=[a[j]||'',a[i]||''];});}
function sigSplice(st,at,del,add){['pid','res'].forEach(k=>{const a=st.sig[k]||(st.sig[k]=[]);while(a.length<at)a.push('');a.splice(at,del,...Array(add).fill(''));});}
/* 相机顺序：MQ 即穴位顺序，其余类型即采图顺序 */
function camMove(st,camId,dir){
  const cams=CAMS.filter(c=>c.st===st.no);
  const i=cams.findIndex(c=>c.id===camId), j=i+dir;
  if(i<0||j<0||j>=cams.length)return;
  const a=cams[i], b=cams[j], ia=CAMS.indexOf(a), ib=CAMS.indexOf(b);

/* 移除相机：解除本工位对该设备的选用，它在本工位的图像一并删除（设备保留在设备列表） */
function camRemove(st,c){

      const j=CAMS.filter(x=>x.st===st.no).indexOf(c);if(prodMap(st)==='cam')sigSplice(st,j,1,0);

function bindNname(st,sc){

/* 复制一张图（含元素与检测项），放在原图之后 */
function imgCopy(srcId){

  const ids=allSigIds(), cp=a=>(a||[]).map(g=>{const x={...g,tgt:g.tgt?{...g.tgt}:g.tgt,id:nextId('g',ids)};ids.push(x);return x;});

/* 图像字段：同一张图可能在多处出现，全部写同一个对象 */
function bindImf(){

        const j=imgsOf(im.cam).indexOf(im);

/* §88 采图握手的启用态。种子数据里没有这个字段，缺省就是启用——
   已有工程打开时不该突然全部变成「未启用」。 */
const hsOn=st=>st.hs!==0;
/* ================= 工位设置：采图流程图（用户 2026-10-09 设计基线，专项第六节） =================
   左画布、右属性，卡片统一尺寸。骨架由「采图握手」与相机触发方式自动生成，固定步骤灰底、不编号、不可删改顺序：

/* 一张图上有哪些方案（＝几次算法执行） */
function schsOf(im){
  const out=[];
  const sc=SCH[im.id];
  if(sc){
    let v='OK';
    Object.keys(sc.out||{}).forEach(cl=>{const n=sc.out[cl];
      if(n==null)v=v==='NG'?'NG':'Fail';
      else if(n>((sc.lim||{})[cl]??0))v='NG';});
    out.push({id:'ai:'+im.id,n:`AI 检测 ${sc.model}`,ic:'brain',v,ms:36,
      tip:`模型 ${sc.model} · 输出 ${Object.keys(sc.out).join(' / ')}`});
  }
  im.items.forEach(k=>{
    out.push({id:'it:'+k+'@'+im.cam,n:`${ITEMS[k].scheme}`,ic:ITEMS[k].fam==='尺寸'?'ruler-measure':'text-recognition',
      v:vd(k,im.cam),ms:18,tip:`输出到检测项「${ITEMS[k].n}」`});});
  return out;
}
/* 方案 id → 所属图与检测项 */
function schInfo(id){
  if(id.startsWith('ai:')){
    const im=IMGS.find(x=>x.id===id.slice(3));
    return {kind:'ai',im,sc:SCH[im.id],items:[]};}
  const rest=id.slice(3), k=rest.split('@')[0], cam=rest.split('@')[1];
  return {kind:'one',im:imgOf(k,cam),sc:IMPL[rest],items:[k],key:k,cam};
}

/* 每穴图数：定拍 / 激光＝全部相机的图像之和（只有 1 穴）；MQ＝每台相机的图像数；飞拍＝1（一穴一张，图像数就是穴位数）。
   原先飞拍也取「相机图像数」，导致 6 穴 × 6 = 36 的错误合计（2026-10-07 修正） */
const perOf=st=>{const cams=CAMS.filter(c=>c.st===st.no);
  if(prodMap(st)==='shot')return cams.length?shotN(cams[0]):0;
  return st.rel==='same'?cams.reduce((a,c)=>a+IMGS.filter(x=>x.cam===c.id).length,0)
    :(cams.length?IMGS.filter(x=>x.cam===cams[0].id).length:0);};
