/* 图像配置：左选相机，右改该相机的图像列表 */
function renumberImgs(camId){
  IMGS.filter(x=>x.cam===camId).forEach((im,i)=>im.no=i+1);
}
function imgsOf(camId){return IMGS.filter(x=>x.cam===camId);}


/* 改工位类型：类型决定相机关系与工作模式，两处入口共用 */
function setStType(no,v){
  const st=STATIONS.find(x=>x.no==no); if(!st)return;
  st.type=v;
  const t=STTYPE[v];
  if(t.rel){st.rel=t.rel;CAMS.filter(c=>c.st===st.no).forEach(c=>{c.mode=t.mode;});}
  DIRTY++;
}
/* 改工位名：机台结构表与工位页共用 */
function setStName(no,v){
  const st=STATIONS.find(x=>x.no==no); if(!st)return;
  st.name=v.trim()||st.name;DIRTY++;
}


/* 新增一行：参数复制上一行 */
function imgAdd(camId,after){
  const imgs=imgsOf(camId);
  const src=after?imgs.find(x=>x.id===after):imgs[imgs.length-1];
  const id=newImgId();
  const neo=src
    ? {id,cam:camId,no:0,name:src.name,exp:src.exp,gain:src.gain,aoi:[...src.aoi],
       src:src.src,locs:(src.locs||[]).map(L=>Object.assign(newLoc(L.m),{p:{...L.p}})),
       state:'OK',els:[],items:[]}
    : {id,cam:camId,no:0,name:'图像1',exp:1200,gain:3.6,aoi:[0,0,2448,2048],
       src:'环形白光',locs:[newLoc('模板匹配')],state:'OK',els:[],items:[]};
  const gi = src ? IMGS.indexOf(src)+1 : IMGS.length;
  IMGS.splice(gi,0,neo);
  renumberImgs(camId);S.imgrow=id;
}
function imgRemove(){
  const im=IMGS.find(x=>x.id===S.imgrow); if(!im)return;
  const cam=im.cam, n=im.items.length+im.els.length;
  confirmDlg('删除图像','trash',`确认删除 第 ${im.no} 行 ${im.name}？`,'',
    '删除','dgr',()=>{
      im.els.forEach(e=>delete ELS[e]);im.items.forEach(k=>delete ITEMS[k]);
      IMGS.splice(IMGS.indexOf(im),1);renumberImgs(cam);S.imgrow=null;},n?[['元素',im.els.length],['检测项',im.items.length]]:null);
}
function imgMove(dir){
  const im=IMGS.find(x=>x.id===S.imgrow); if(!im)return;
  const list=imgsOf(im.cam), i=list.indexOf(im), j=i+dir;
  if(j<0||j>=list.length)return;
  const other=list[j], gi=IMGS.indexOf(im), gj=IMGS.indexOf(other);
  IMGS[gi]=other;IMGS[gj]=im;
  renumberImgs(im.cam);
}
function imgBatchDlg(camId){
  const base=imgsOf(camId).length;
  dlg(dlgShell({size:'s',icon:'grid',title:'批量新增图像',sub:camOf(camId).name,
    body:'<div class="dform">'+FD('数量','<input class="fi" id="bn" value="20">','张',1)+
      FD('名称前缀','<input class="fi" id="bp" value="图像">')+'</div>',
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-ok>新增</button>'}));
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=closeDlg);
  $('#dlgmask [data-ok]').onclick=()=>{
    const n=Math.max(1,Math.min(200,parseInt($('#bn').value)||1)), pre=$('#bp').value;
    for(let i=0;i<n;i++){imgAdd(camId);
      const last=imgsOf(camId).slice(-1)[0]; last.name=`${pre}${base+i+1}`;}
    closeDlg();renderAll();};
}
function imgSync(camId){
  const c=camOf(camId), peers=CAMS.filter(y=>y.st===c.st&&y.id!==c.id);
  if(!peers.length)return;
  confirmDlg('同步到本工位其他相机','copy',
    `把 <b>${c.name}</b> 的 ${imgsOf(camId).length} 张图像结构同步到 ${peers.map(p=>p.name).join('、')}？`,
    '目标相机原有图像及其上的检测项将被覆盖','同步','dgr',()=>{
      peers.forEach(p=>{
        imgsOf(p.id).forEach(im=>{im.els.forEach(e=>delete ELS[e]);
          im.items.forEach(k=>delete ITEMS[k]);IMGS.splice(IMGS.indexOf(im),1);});
        imgsOf(camId).forEach(im=>{const id=newImgId();
          IMGS.push({...im,id,cam:p.id,els:[],items:[]});});
        renumberImgs(p.id);});});
}

/* 灰度直方图 */
function histSVG(laser){
  if(laser)return `<svg viewBox="0 0 400 56" preserveAspectRatio="none">
    <rect width="400" height="56" fill="var(--canvas)"/>
    <text x="200" y="32" fill="#94A3B8" font-size="11" text-anchor="middle">线激光无灰度直方图</text></svg>`;
  const bars=Array.from({length:64},(_,i)=>{
    const x=i/63, v=Math.exp(-Math.pow((x-0.46)*3.1,2))*0.92+Math.exp(-Math.pow((x-0.82)*9,2))*0.28+0.02;
    return v;});
  const mx=Math.max(...bars);
  return `<svg viewBox="0 0 400 56" preserveAspectRatio="none">
    <rect width="400" height="56" fill="#F8FAFC"/>
    ${bars.map((v,i)=>{const h=v/mx*50;
      return `<rect x="${i*6.25}" y="${54-h}" width="5.4" height="${h}" fill="${
        i<2?'#DC2626':i>61?'#DC2626':'#94A3B8'}"/>`}).join('')}
    <line x1="0" y1="54" x2="400" y2="54" stroke="#CBD5E1"/></svg>`;
}

   共用方案的一行：「全行」下改的是默认值（DEFV），某一穴下改的是这一格的微调（OVR[格]）。
   可微调＝ROI 与算法两节；判定（标准值、公差、上限）整行统一，格聚焦下置灰。
   键＝节点 + 分节 + 参数名 + 序号，原型里参数控件多为示意值，按此键覆盖显示值 */
const OVR={}, DEFV={};
const ovrCount=id=>Object.keys(OVR[id]||{}).length;
const OVRSEC=['ROI','算法'];
/* 默认同步（用户 2026-10-12）：在任一张图上改参数，同视角各穴位一起生效；
   要单独微调时，在 ROI / 算法分组标题打开「单独微调」，之后这一组的改动只记在本图（OVR[图]） */
/* 多穴位共用方案：飞拍各穴共用同一检测流程与参数（用户 2026-10-14 更正）；MQ 各相机共用节点结构，ROI 与算法参数按相机——选中哪台改的就是哪台。
   与默认值不同的值标橙；分组标题「同步到所有穴位」把本穴的值推给其他穴（没有不同值时置灰）。判定规格仍整行统一。 */
function applyOvr(){
  if(S.rail!=='insp'||!/^(el|sch|loc)$/.test(S.sel.t))return;
  const im=curImg(), st0=stOf(camOf(im.cam)), cell=rowShared(im)&&prodMap(st0)==='cam'?im.id:null;   /* 飞拍所有穴位共用流程与参数（用户 2026-10-14）；MQ 各相机参数按相机 */
  const own=(OVR[im.id]=OVR[im.id]||{}), pre=S.sel.id+'|';
  $$('#propbody .psec').forEach(sec=>{
    const t=(sec.querySelector('.psh .sp')||{}).textContent;
    if(!OVRSEC.includes(t))return;
    const sk=pre+t, keys=[];
    sec.querySelectorAll('.prow').forEach(row=>{
      const lb=(row.querySelector('.lb')||{}).textContent||'';
      row.querySelectorAll('input.fi,select.fi').forEach((e,k)=>{
        const key=sk+'|'+lb+'|'+k; keys.push(key);
        if(DEFV[key]==null)DEFV[key]=e.value;
        const base=String(DEFV[key]);
        e.value=cell&&own[key]!=null?own[key]:base;
        if(cell&&own[key]!=null&&String(own[key])!==base)e.classList.add('ovr');
        e.addEventListener('change',()=>{if(cell){if(e.value===base)delete own[key];else own[key]=e.value;}else DEFV[key]=e.value;DIRTY++;setTimeout(renderAll,0);},true);});});
    if(cell){const h=sec.querySelector('.psh'), diff=keys.some(k=>own[k]!=null);
      h.insertAdjacentHTML('beforeend',`<span class="lbtn psync${diff?'':' dis'}" title="${diff?`把「${im.name}」的${t}参数同步到所有穴位`:'本穴与其他穴位相同'}">${I('copy')}同步到所有穴位</span>`);
      const b=h.querySelector('.psync'); renderIcons(b);
      b.onclick=e=>{e.stopPropagation(); if(!diff)return;
        keys.forEach(k=>{if(own[k]!=null)DEFV[k]=own[k];});
        rowCells(schemeHost(im)).forEach(c=>{const o=OVR[c.id];if(o)keys.forEach(k=>delete o[k]);});
        DIRTY++;toast(`已把「${im.name}」的${t}参数同步到所有穴位`);renderAll();};}
  });
}

   一行 = 一件产品走完全流程。检测项横向展开，按工位分组；
   整件汇总的缺陷项不属于任何单一工位，单列一组。 */

/* 输出列 = 检测清单里勾了「输出」的项，顺序沿用清单的上移下移 */
const outKeys=()=>orderKeys().filter(k=>ITEMS[k].out);

/* 四行规格：标准值 / 上限 / 下限，取值随类型走 */
function specRow(k,which){
  const it=ITEMS[k];
  if(it.fam==='尺寸')return which==='std'?fmt(it.std)
    :which==='hi'?fmt(it.std+it.tu):fmt(it.std+it.td);
  if(it.fam==='缺陷')return which==='std'?'0':which==='hi'?String(it.thr??0):'—';
  if(it.fam==='字符')return which==='std'?(it.expect||'—'):'—';
  return '—';
}
/* 判定：直接拿行里存的实测值比，不走当前画面的算法结果 */
function rowVd(k,v){
  const it=ITEMS[k];
  if(v==null)return 'Fail';
  if(it.fam==='尺寸')return (v-it.std<=it.tu&&v-it.std>=it.td)?'OK':'NG';
  if(it.fam==='缺陷')return v<=(it.thr??0)?'OK':'NG';
  if(it.fam==='字符')return String(v)===it.expect?'OK':'NG';
  return 'OK';
}
function cellText(k,v){
  if(v==null)return '—';
  const it=ITEMS[k];
  return it.fam==='尺寸'?fmt(v):String(v);
}
/* 整件分档值：三态模式给 OK/NG/Fail 对应值，分档模式按尺寸落档 */
function rowBin(r,ks){
  if(ks.some(k=>r.v[k]==null))return {t:'Fail',v:USEFAIL?3:2};
  if(ks.some(k=>rowVd(k,r.v[k])==='NG'))return {t:'NG',v:2};
  if(JMODE==='tri')return {t:'OK',v:1};
  const d=ks.find(k=>ITEMS[k].fam==='尺寸');
  if(!d)return {t:'BIN1',v:1};
  const it=ITEMS[d], span=(it.tu-it.td)/BINOUT.n||1;
  const i=Math.min(BINOUT.n,Math.max(1,Math.ceil((r.v[d]-it.std-it.td)/span)));
  return {t:'BIN'+i,v:i};
}

function genRows(n,seed,kind){
  let x=seed;
  const rnd=()=>{x=(x*1103515245+12345)&0x7fffffff;return x/0x7fffffff;};
  const ks=Object.keys(ITEMS), out=[];
  const slots=Math.max(1,BINOUT.n);
  for(let i=0;i<n;i++){
    const v={};
    ks.forEach(k=>{
      const it=ITEMS[k];
      if(it.fam==='尺寸'){
        const sp=(it.tu-it.td)||0.1;
        let a=it.std+it.td+sp*(0.12+0.76*rnd());
        if(rnd()<0.035)a=it.std+it.tu+sp*0.35;                 /* 少量超差 */
        v[k]=+a.toFixed(it.std>=1?3:4);
      }else if(it.fam==='缺陷'){
        const thr=it.thr??0;
        const r2=rnd();
        v[k]= r2<0.72?Math.round(thr*0.35*rnd()) : r2<0.94?thr : thr+1+Math.floor(rnd()*2);
      }else v[k]= rnd()<0.03?'HX-2411':it.expect;
    });
    if(rnd()<0.02)v[ks[Math.floor(rnd()*ks.length)]]=null;      /* 偶发 Fail */
    const t=new Date(2026,7,25,9,31,4,140).getTime()+i*1240;
    const d=new Date(t);
    /* 生产库里越早的件，跑的是越旧的方案版本 */
    const ver = kind==='prod' ? (i < n*0.28 ? 'v7' : PLANVER) : PLANVER;
    out.push({no:i+1, ver,
      t:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${
         String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`,
      slot:(i%slots)+1,
      sn:kind==='dbg'&&DBG.mode==='online'
        ? `DBG-260825-${String(i+1).padStart(4,'0')}`
        : `P-26081${String(10237+i).padStart(5,'0')}`,
      v});
  }
  return out;
}

        const num=it.fam==='尺寸', a=actOf(inf.key,inf.cam), d=(a!=null&&num)?a-it.std:null;
        r.push({n:'实测值',t:'数值',v:a==null?'—':fmt(a),err:res==='NG'});
        if(num)r.push({n:'标准值',t:'数值',v:fmt(it.std)},

        else r.push({n:'允许缺陷',t:'文本',v:it.rule});
      }
      r.push({n:'判定结果',t:'布尔',v:res,pill:1});
      return r;};

    let rows=[];
    if(S.sel.t==='el')rows=elRows(S.sel.id);

      if(im)rows=[].concat(imgLocRows(im),...im.els.map(elRows),...schsOf(im).map(sh=>schRows(sh.id)));
    }
    $('#tpbody').innerHTML = rows.length

        rows.map(r=>`<tr${r.nd?' class="nd"':''}>

          <td class="dim u-fs">${r.t}</td>

      : `<div class="holder">${I('bug')}<div>在对象树里选中图像、定位、元素或方案</div></div>`;
  } else if(k==='dout'||k==='pout'){
    const dbg=k==='dout';
    const ks=outKeys(), rows=dbg?DOUT:POUT;

  } else if(k==='def'){
    const rows=[];
    IMGS.forEach(im=>{const sc=SCH[im.id]; if(!sc)return;

      Object.keys(sc.out||{}).forEach(cl=>{

        for(let i=0;i<n;i++)rows.push({c,im,cl,sc,

          over:n>((sc.lim||{})[cl]??0)});});});
    $('#tpbody').innerHTML=`<table class="ltab"><thead><tr>
      <th style="width:56px" class="num">#</th><th style="width:150px">工位</th>
      <th style="width:90px">相机</th><th style="width:120px">图像</th>

      <th style="width:90px" class="num">置信度</th><th>本图</th>
      </tr></thead><tbody>`+
      (rows.length?rows.map((r,i)=>{
        return `<tr class="u-click" data-gimg="${r.im.id}" data-gdef="${r.cl}">
          <td class="num dim">${String(i+1).padStart(3,'0')}</td>
          <td class="dim">工位${r.c.st} ${stOf(r.c).name}</td>

    /* 用户是带着「001 号划伤在 820,266」这个问题跳过来的，落地只换张图等于把问题

/* 批次回放：一次灌多件历史图，跑完写进调试输出 */
/* 批次回放：按生产批次号 / 产品 SN / 判定结果查询，结果表勾选后载入（用户 2026-10-08；去掉时间段） */
const RVBATCH=[['B2608250901',1,48],['B2608250902',49,90],['B2608250903',91,120]];
const rvPool=()=>{const out=[];
  RVBATCH.forEach(([b,x,z])=>{for(let i=x;i<=z;i++){const r=histAbs(i),h=(i*2654435761)>>>0;
    out.push({i,b,sn:r.sn,t:r.t,v:['OK','NG','OK','Fail','NG','OK','OK','NG'][h%8]});}});
  return out;};
let RVQ={b:RVBATCH[RVBATCH.length-1][0],sn:'',res:''};
function replayDlg(){
  const pool=rvPool();
  const match=()=>pool.filter(r=>(!RVQ.b||r.b===RVQ.b)&&(!RVQ.sn||r.sn.includes(RVQ.sn))&&(!RVQ.res||r.v===RVQ.res));
  let L=match(), pick=new Set(L.map(r=>r.i));
  const opt=(v,tx,cur)=>`<option value="${v}"${cur===v?' selected':''}>${tx}</option>`;
  dlg(dlgShell({size:'l',fix:1,icon:'history',title:'批次回放',
    body:`<div class="rvq"><span class="rl">生产批次号</span><select class="fi" data-rq="b">${opt('','全部批次',RVQ.b)+RVBATCH.map(x=>opt(x[0],x[0],RVQ.b)).join('')}</select>
      <span class="rl">产品 SN</span><input class="fi sn" data-rq="sn" value="${RVQ.sn}">
      <span class="rl">判定结果</span><select class="fi" data-rq="res">${opt('','全部',RVQ.res)+['OK','NG','Fail'].map(x=>opt(x,x,RVQ.res)).join('')}</select></div>
      <div class="u-box"><table class="ltab"><thead><tr><th class="rpk"><span class="chk" id="rvall"></span></th>
        <th class="rpb">生产批次号</th><th class="rps">产品 SN</th><th class="rpt">采集时间</th><th>判定结果</th></tr></thead><tbody id="rvbody"></tbody></table></div>
      <div class="tempty" id="rvempty"></div>`,
    left:'已选 <b id="rvc">0</b> 件',
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-ok>回放</button>'}));
  const upd=()=>{
    $('#rvbody').innerHTML=L.map(r=>`<tr class="u-click" data-rr="${r.i}"><td><span class="chk${pick.has(r.i)?' on':''}">${pick.has(r.i)?I('check'):''}</span></td>
      <td>${r.b}</td><td>${r.sn}</td><td class="dim">${r.t}</td><td><span class="pill ${pv(r.v)}">${r.v}</span></td></tr>`).join('');
    const all=L.length&&L.every(r=>pick.has(r.i));
    const ca=$('#rvall');ca.className='chk'+(all?' on':'');ca.innerHTML=all?I('check'):'';
    $('#rvempty').textContent=L.length?'':'没有符合条件的产品';
    $('#rvc').textContent=pick.size;
    $('#dlgmask [data-ok]').disabled=!pick.size;
    renderIcons($('#dlgmask'));
    $$('#rvbody [data-rr]').forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.rr;pick.has(i)?pick.delete(i):pick.add(i);upd();});};
  $('#rvall').onclick=()=>{const all=L.length&&L.every(r=>pick.has(r.i));L.forEach(r=>all?pick.delete(r.i):pick.add(r.i));upd();};
  $$('#dlgmask [data-rq]').forEach(el=>el[el.tagName==='INPUT'?'oninput':'onchange']=()=>{
    RVQ[el.dataset.rq]=el.value.trim();L=match();pick=new Set(L.map(r=>r.i));upd();});
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=closeDlg);
  $('#dlgmask [data-ok]').onclick=()=>{
    const list=[...pick].sort((x,y)=>x-y);
    LOCAL=null;DBG.rvList=list;DBG.mode='offline';DBG.histN=list.length;DBG.hist=1;RPDONE={};
    S.srcm='batch';
    closeDlg();renderAll();syncDock();renderCamMatrix();
    toast(`已载入 ${list.length} 件${RVQ.b?' · '+RVQ.b:''} · 点「连续测试运行」回放`);};
  upd();
}

/* ================= 生产页 ================= */

const KINDS={
 lbl  :{n:'标签',        i:'label',        c:'基础', w:180,h:36},

 mx   :{n:'相机 × 图像', i:'grid',         c:'视觉', w:900,h:420},

const KCATS=['基础','容器','按钮','状态','数据','视觉'];
const TONES={'默认':'','正常':'t-ok','警告':'t-warn','危险':'t-err'};
const STATK={out:['产量','box','','12,847',''],yield:['良率','chart-line','var(--ok)','98.70','%'],
 ct:['节拍','clock','','1.24','s'],ng:['本件 NG 项','circle-x','var(--err)','',''],
 fail:['本件 Fail 项','alert-triangle','var(--warn)','',''],cum:['累计 NG','history','var(--err)','167','']};

function EL(k,t,x,y,o){const d=KINDS[k];return Object.assign(
  {id:++EUID,k,t,x,y,w:d.w,h:d.h,tone:'默认',cam:'',f:'all',stat:'out',act:'start',
   verd:'all',item:'',page:'',img:'',mode:'img',n:3,vis:true,lock:false},o||{});}
let PAGES=[
 {id:'p1',n:'标准生产画面',def:1,els:[

];

function renderWip(e){

  let h='<span class="lb">在制品</span>';
  STATIONS.forEach((st,i)=>{

      <div class="wipst"><span class="sn">工位${st.no} ${st.name}${st.rel==='lane'?' · 并行':''}</span>`+

function renderMList(e){

  $$(`#ml_${e.id} .lamp`).forEach(el=>el.onclick=ev=>{

let HPG=0, HSEL=[], HMODE='edit', HGRID=1, HSNAP=1, HBIND=0, HZOOM=0, HPLACE=null, HBASE=null;

/* 勾选检测项 → 自动摆成数值卡。摆不下的进下一列。 */
function fromList(){
  const ks=Object.keys(ITEMS);
  const have0=new Set(PAGES.flatMap(pp=>pp.els).filter(e=>e.k==='num'&&e.item).map(e=>e.item));
  dlg(dlgShell({size:'l',icon:'clipboard-list',title:'生成数值卡',sub:hpg().n,
    body:`<div class="u-box"><table class="ltab"><thead><tr><th style="width:52px"><span class="chk" data-fall></span></th>
      <th>检测项</th><th style="width:240px">方案</th><th style="width:160px">画面上</th></tr></thead><tbody>${ks.map(k=>{
        const on=have0.has(k);
        return `<tr${on?'':' class="u-click"'} data-fk="${k}"><td>${on?'<span class="chk dis"></span>':'<span class="chk"></span>'}</td>
          <td${on?' class="dim"':''}>${ITEMS[k].n}</td><td class="dim">${ITEMS[k].scheme}</td>
          <td class="dim">${on?'已有':'—'}</td></tr>`;}).join('')}</tbody></table></div>`,
    left:'已选 <b id="fgn">0</b> 项',
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-fgen disabled>生成</button>'}));
  const free=$$('#dlgmask tr[data-fk]').filter(tr=>!have0.has(tr.dataset.fk));
  const setC=(c,on)=>{c.classList.toggle('on',on);c.innerHTML=on?'<i class="ti ti-check"></i>':'';};
  const sync=()=>{const n=free.filter(tr=>tr.querySelector('.chk.on')).length;$('#fgn').textContent=n;
    $('#dlgmask [data-fgen]').disabled=!n;setC($('#dlgmask [data-fall]'),n&&n===free.length);renderIcons($('#dlgmask'));};
  free.forEach(tr=>{if(ITEMS[tr.dataset.fk].out)setC(tr.querySelector('.chk'),true);
    tr.onclick=()=>{const c=tr.querySelector('.chk');setC(c,!c.classList.contains('on'));sync();};});
  $('#dlgmask [data-fall]').onclick=()=>{const on=free.some(tr=>!tr.querySelector('.chk.on'));
    free.forEach(tr=>setC(tr.querySelector('.chk'),on));sync();};
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=closeDlg);
  sync();
  const btn=$('#dlgmask [data-fgen]');
  btn.onclick=()=>{
    const have=new Set(PAGES.flatMap(pp=>pp.els).filter(e=>e.k==='num'&&e.item).map(e=>e.item));
    const pick=free.filter(tr=>tr.querySelector('.chk.on'))
      .map(tr=>tr.dataset.fk).filter(k=>!have.has(k));
    closeDlg();
    if(!pick.length){renderHmi();return toast('勾中的检测项已经都在画面上了');}
    const d=KINDS.num, GX=d.w+24, GY=d.h+16, M=24;
    let p=hpg(), pages=0;
    /* 当前画面下方还有多少空地 */
    let x=M, y=p.els.reduce((m,e)=>Math.max(m,e.y+e.h),0)+M;
    const fresh=()=>{PAGES.push({id:nextId('p',PAGES),n:'检测项 '+(++pages),def:0,els:[]});
      HPG=PAGES.length-1; p=hpg(); x=M; y=M;};
    if(y+d.h>HMIH-M)fresh();          /* 当前画面排不下就另起一页，而不是悄悄丢掉 */
    pick.forEach(k=>{
      if(x+d.w>HMIW-M){x=M;y+=GY;}
      if(y+d.h>HMIH-M)fresh();
      p.els.push(EL('num',ITEMS[k].n,x,y,{item:k}));
      x+=GX;});
    HSEL=[];renderHmi();
    toast(`已生成 ${pick.length} 个数值卡${pages?`，新建了 ${pages} 个画面`:''}`);
  };
}

/* 画布上的元件：编辑态画成占位块，不渲染真实内容 —— 编辑时看的是版式 */
function helShell(e,sc){
  const d=kindOf(e), on=HSEL.includes(e.id);
  const bd=HBIND?hmiBindText(e):'';
  return `<div class="hel${on?' on':''}${e.lock?' lk':''}" data-hel="${e.id}"
    style="left:${e.x*sc}px;top:${e.y*sc}px;width:${e.w*sc}px;height:${e.h*sc}px;
      opacity:${e.vis===false?.35:1};${helLook(e)}">
    <div class="cap">${I(d.i)}<span>${e.t||d.n}</span>
      ${bd?`<span class="bd">${bd}</span>`:''}</div>
    <div class="hz se"></div><div class="hz e"></div><div class="hz s"></div></div>`;
}
function helLook(e){
  if(e.k==='estop')return 'background:var(--err-bg);border-color:var(--err-line)';
  if(e.k==='ctl')  return e.tone==='正常'?'background:var(--ok-bg);border-color:var(--ok-line)'
                        :e.tone==='警告'?'background:var(--warn-bg);border-color:var(--warn-line)'
                        :e.tone==='危险'?'background:var(--err-bg);border-color:var(--err-line)'
                        :'background:var(--white);border-color:var(--line-strong)';
  if(e.k==='panel'||e.k==='rect')return 'background:var(--canvas);border-color:var(--line-strong)';
  if(e.k==='lbl')return 'background:transparent;border-color:var(--line)';
  return 'background:var(--panel);border-color:var(--line-strong)';
}
function hmiBindText(e){
  const d=kindOf(e);
  if(d.b==='cam')  return e.cam?(camOf(e.cam)||{}).name||e.cam:'全部相机';
  if(d.b==='stat') return (STATK[e.stat]||[])[0]||'';
  if(d.b==='verd') return VERDS[e.verd]||'';
  if(d.b==='item') return e.item&&ITEMS[e.item]?ITEMS[e.item].n:'未绑定';
  if(d.b==='page'){const p=PAGES.find(x=>x.id===e.page);return p?p.n:'未指定画面';}
  return '';
}

    hGRP('位置','位置与尺寸',
      hF('X / Y',hIN('x',e.x,'num')+hIN('y',e.y,'num')+'<span class="u-muted u-fs">px</span>')+
      hF('宽 / 高',hIN('w',e.w,'num')+hIN('h',e.h,'num')+'<span class="u-muted u-fs">px</span>')+
      hF('层级',`<button class="hb" data-hp="front">${I('front')}置顶</button>
                 <button class="hb" data-hp="back">${I('back')}置底</button>`))+
    (tone?hGRP('外观','外观',tone):'')+

function bindHmiProp(){
  const R=$('#hmiprop');
  const apply=(key,val)=>{
    const s=hsel(), p=hpg();
    if(key==='pn'){p.n=val;return renderHmi();}
    if(key==='setdef'){PAGES.forEach(x=>x.def=0);p.def=1;return renderHmi();}
    if(!s.length)return;
    if(key==='vis'){s.forEach(e=>e.vis=e.vis===false);return renderHmi();}
    if(key==='lock'){s.forEach(e=>e.lock=!e.lock);return renderHmi();}
    if(key==='front'||key==='back')return hmiOrder(key);
    if(/^[xywh]$/.test(key)){
      const v=parseInt(val,10); if(isNaN(v))return;
      s.forEach(e=>{
        if(key==='w')e.w=Math.max(24,Math.min(HMIW-e.x,v));
        else if(key==='h')e.h=Math.max(20,Math.min(HMIH-e.y,v));
        else if(key==='x')e.x=Math.max(0,Math.min(HMIW-e.w,v));
        else e.y=Math.max(0,Math.min(HMIH-e.h,v));});
      return renderHmi();}
    if(key==='n'){s.forEach(e=>e.n=Math.max(1,parseInt(val,10)||3));return renderHmi();}
    s.forEach(e=>e[key]=val);renderHmi();};
  $$('[data-hp]',R).forEach(el=>{
    const k=el.dataset.hp;
    if(el.tagName==='BUTTON')el.onclick=()=>apply(k);
    else el.onchange=()=>apply(k,el.value);});
}
/* ---------- 排版动作 ---------- */
function hmiAlign(a){
  const s=hsel(); if(s.length<2&&!/^(front|back)$/.test(a))return;
  if(a==='front'||a==='back')return hmiOrder(a);
  const L=Math.min(...s.map(e=>e.x)), R=Math.max(...s.map(e=>e.x+e.w));
  const T=Math.min(...s.map(e=>e.y)), B=Math.max(...s.map(e=>e.y+e.h));
  if(a==='l') s.forEach(e=>e.x=L);
  if(a==='r') s.forEach(e=>e.x=R-e.w);
  if(a==='cx')s.forEach(e=>e.x=Math.round((L+R)/2-e.w/2));
  if(a==='t') s.forEach(e=>e.y=T);
  if(a==='b') s.forEach(e=>e.y=B-e.h);
  if(a==='cy')s.forEach(e=>e.y=Math.round((T+B)/2-e.h/2));
  if(a==='dx'&&s.length>2){
    const l=s.slice().sort((p,q)=>p.x-q.x);
    const gap=(l[l.length-1].x-l[0].x)/(l.length-1);
    l.forEach((e,i)=>e.x=Math.round(l[0].x+gap*i));}
  if(a==='dy'&&s.length>2){
    const l=s.slice().sort((p,q)=>p.y-q.y);
    const gap=(l[l.length-1].y-l[0].y)/(l.length-1);
    l.forEach((e,i)=>e.y=Math.round(l[0].y+gap*i));}
  renderHmi();
}
function hmiOrder(a){
  const p=hpg(), s=hsel(); if(!s.length)return;
  p.els=p.els.filter(e=>!s.includes(e));
  if(a==='front')p.els=p.els.concat(s); else p.els=s.concat(p.els);
  renderHmi();
}

function bindHmi(){
  /* 工具条与底部按钮：一次绑定，不随 renderAll 重来 */
  $$('#hmitools [data-al]').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('dis'))hmiAlign(b.dataset.al);});
  $$('#hmimask [data-h]').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('dis'))return;
    const a=b.dataset.h, p=hpg();
    /* 操作员画面是检测方案的投影，不是另做一套。
       PC-DMIS 的 Operator 模式只跑编程模式里标记过的东西——同一个模型，一次标记。
       自由画布保留，但 80% 的场景走这条更轻的路。 */
    if(a==='fromlist')return fromList();
    if(a==='grid'){HGRID=!HGRID;return renderHmi();}
    if(a==='snap'){HSNAP=!HSNAP;return renderHmi();}
    if(a==='bind'){HBIND=!HBIND;return renderHmi();}
    if(a==='zin'||a==='zout'){
      const L=[.35,.5,.75,1], cur=HZOOM||hmiScale();
      HZOOM=a==='zin'?(L.find(x=>x>cur+.01)||1):([...L].reverse().find(x=>x<cur-.01)||.35);
      return renderHmi();}
    if(a==='close')return closeHmi();
    if(a==='save'){HBASE=JSON.stringify(PAGES);PGACT=hpg().id;
      toast('画面已保存');if(PRODMODE)renderProd();return renderHmi();}
    if(a==='pgadd')return promptDlg('新建画面','plus','画面名称','新画面',v=>{
      PAGES.push({id:nextId('p',PAGES),n:v,def:0,els:[]});HPG=PAGES.length-1;HSEL=[];renderHmi();});
    if(a==='pgcpy'){const c=JSON.parse(JSON.stringify(p));
      c.id=nextId('p',PAGES);c.n=p.n+' 副本';c.def=0;
      c.els.forEach(e=>e.id=++EUID);
      PAGES.splice(HPG+1,0,c);HPG++;HSEL=[];return renderHmi();}
    if(a==='pgren')return promptDlg('重命名','pencil','画面名称',p.n,v=>{p.n=v;renderHmi();});
    if(a==='pgdel'){
      if(PAGES.length<2)return toast('至少要保留一个画面');
      return confirmDlg('删除画面','trash',`确定删除画面 <b>${p.n}</b>？`,'','删除','dgr',()=>{
        PAGES.splice(HPG,1);
        if(!PAGES.some(x=>x.def))PAGES[0].def=1;
        PGACT=(PAGES.find(x=>x.def)||PAGES[0]).id;
        HPG=Math.max(0,HPG-1);HSEL=[];renderHmi();});}
    if(a==='elcpy'){const s=hsel();
      const c=s.map(e=>Object.assign({},e,{id:++EUID,x:Math.min(HMIW-e.w,e.x+20),
        y:Math.min(HMIH-e.h,e.y+20)}));
      p.els=p.els.concat(c);HSEL=c.map(e=>e.id);return renderHmi();}
    if(a==='eldel'){const s=hsel();p.els=p.els.filter(e=>!s.includes(e));HSEL=[];return renderHmi();}
    if(a==='elup')  return hmiOrder('front');
    if(a==='eldn')  return hmiOrder('back');
  });
  $$('#hmimode .sg').forEach(x=>x.onclick=()=>{
    HMODE=x.dataset.hm;if(HMODE==='prev')HPLACE=null;renderHmi();});
  $('#hmizoom').onchange=e=>{HZOOM=+e.target.value;renderHmi();};

  /* 画布：单击放置 / 空白处取消选中 */
  $('#screen').addEventListener('mousedown',ev=>{
    if(HMODE!=='edit')return;
    if(ev.target.closest('.hel'))return;
    const b=$('#screen').getBoundingClientRect(), sc=hmiScale();
    let x=Math.round((ev.clientX-b.left)/SCALE/sc), y=Math.round((ev.clientY-b.top)/SCALE/sc);
    if(HPLACE){
      const d=KINDS[HPLACE];
      if(HSNAP){x=Math.round(x/HSTEP)*HSTEP;y=Math.round(y/HSTEP)*HSTEP;}
      x=Math.max(0,Math.min(HMIW-d.w,x));y=Math.max(0,Math.min(HMIH-d.h,y));
      const e=EL(HPLACE,'',x,y);
      hpg().els.push(e);HSEL=[e.id];HPLACE=null;return renderHmi();}
    HSEL=[];renderHmi();});

  /* 拖动 / 拉伸 */
  let md=null,st=null,mx=0,my=0;
  document.addEventListener('mousedown',ev=>{
    if(!$('#hmimask').classList.contains('on')||HMODE!=='edit')return;
    const h=ev.target.closest&&ev.target.closest('#screen .hel'); if(!h)return;
    const e=helOf(+h.dataset.hel); if(!e||e.lock)return;
    if(!HSEL.includes(e.id)){HSEL=(ev.ctrlKey||ev.metaKey)?HSEL.concat(e.id):[e.id];renderHmi();}
    const z=ev.target.closest('.hz');
    md=z?(z.classList.contains('e')?'e':z.classList.contains('s')?'s':'se'):'mv';
    mx=ev.clientX;my=ev.clientY;
    st=hsel().map(x=>({e:x,x:x.x,y:x.y,w:x.w,h:x.h}));
    ev.preventDefault();});
  document.addEventListener('mousemove',ev=>{
    if(!md||!st)return;
    const sc=hmiScale();
    let dx=(ev.clientX-mx)/SCALE/sc, dy=(ev.clientY-my)/SCALE/sc;
    if(HSNAP){dx=Math.round(dx/HSTEP)*HSTEP;dy=Math.round(dy/HSTEP)*HSTEP;}
    st.forEach(o=>{
      if(md==='mv'){
        o.e.x=Math.max(0,Math.min(HMIW-o.w,Math.round(o.x+dx)));
        o.e.y=Math.max(0,Math.min(HMIH-o.h,Math.round(o.y+dy)));
      }else{
        if(md!=='s')o.e.w=Math.max(24,Math.min(HMIW-o.e.x,Math.round(o.w+dx)));
        if(md!=='e')o.e.h=Math.max(20,Math.min(HMIH-o.e.y,Math.round(o.h+dy)));}});
    /* 拖动辅助线：和别的元件对上边就亮 */
    const a=st[0].e, others=hels().filter(x=>!HSEL.includes(x.id));
    const gx=$('#glx'), gy=$('#gly');
    const snapX=others.find(o=>Math.abs(o.x-a.x)<2||Math.abs(o.x+o.w-(a.x+a.w))<2);
    const snapY=others.find(o=>Math.abs(o.y-a.y)<2||Math.abs(o.y+o.h-(a.y+a.h))<2);
    gy.style.display=snapX?'block':'none';gy.style.left=(a.x*sc)+'px';
    gx.style.display=snapY?'block':'none';gx.style.top =(a.y*sc)+'px';
    renderHmi();
    $('#gly').style.display=snapX?'block':'none';$('#gly').style.left=(a.x*sc)+'px';
    $('#glx').style.display=snapY?'block':'none';$('#glx').style.top =(a.y*sc)+'px';});
  document.addEventListener('mouseup',()=>{
    if(md){md=null;st=null;$('#glx').style.display='none';$('#gly').style.display='none';}});
}

/* 新 id 一律从现有数据算。写死初值早晚和数据对不上，撞 id 后 find() 找到的是旧对象 */
const nextId=(pre,pool)=>{
  const ids=Array.isArray(pool)?pool.map(x=>x.id):Object.keys(pool);
  const n=ids.reduce((a,x)=>{const mm=String(x).match(new RegExp('^'+pre+'(\\d+)$'));
    return mm?Math.max(a,+mm[1]):a;},0);
  return pre+(n+1);};
const newCamId =()=>nextId('c',CAMS);
const newImgId =()=>nextId('i',IMGS);
const newElId  =()=>nextId('e',ELS);

/* 新增工位：直接加一行，参数复制上一行。after 为选中工位号时插到其后 */
function stAdd(after){
  const pos = after ? STATIONS.findIndex(x=>x.no==after)+1 : STATIONS.length;
  const prev = STATIONS[pos-1] || STATIONS[STATIONS.length-1];
  const b = 1010 + STATIONS.length;
  const n = 1100 + STATIONS.length*10, r = 1200 + STATIONS.length*10;
  STATIONS.splice(pos,0,{no:999,name:'新工位',type:prev?prev.type:'fixed',
    rel:prev?prev.rel:'same',
    sig:{req:b+'.0',ack:b+'.1',done:b+'.2',fin:b+'.3',pid:[String(n)],res:[String(r)]},
    to:prev?prev.to:3000,dto:prev?prev.dto:8000});
  renumberStations();
  S.strow=String(pos+1);S.mhelp=S.strow;S.sel={t:'flow'};
  DIRTY++;renderAll();
}

/* --- 工位顺序：工位号始终等于产品流经顺序，相机引用自动跟随 --- */
function moveStation(no,dir){
  const i=STATIONS.findIndex(x=>x.no==no), j=i+dir;
  if(i<0||j<0||j>=STATIONS.length)return;
  const a=STATIONS[i], b=STATIONS[j];
  CAMS.forEach(c=>{if(c.st===a.no)c.st=-1;});
  CAMS.forEach(c=>{if(c.st===b.no)c.st=a.no;});
  CAMS.forEach(c=>{if(c.st===-1)c.st=b.no;});
  const t=a.no; a.no=b.no; b.no=t;
  STATIONS.sort((x,y)=>x.no-y.no);
}
function renumberStations(){
  STATIONS.forEach((st,i)=>{
    const old=st.no, neo=i+1;
    if(old===neo)return;
    CAMS.forEach(c=>{if(c.st===old)c.st=-neo;});
    st.no=neo;});
  CAMS.forEach(c=>{if(c.st<0)c.st=-c.st;});
}

function delItem(k){
  const it=ITEMS[k]; if(!it)return;
  const nImg=IMGS.filter(im=>im.items.includes(k)).length,nAlg=Object.keys(IMPL).filter(x=>x.split('@')[0]===k).length;
  confirmDlg('删除检测项','trash',`确认删除 <b>${it.n}</b>？`,'','删除','dgr',()=>{
    IMGS.forEach(im=>{const i=im.items.indexOf(k);if(i>=0)im.items.splice(i,1);});
    Object.keys(IMPL).forEach(x=>{if(x.split('@')[0]===k)delete IMPL[x];});
    delete ITEMS[k];
    if(ORDER){const i=ORDER.indexOf(k);if(i>=0)ORDER.splice(i,1);}
    S.lrow=null;},[['图像引用',nImg],['算法参数',nAlg]]);
}

/* 检测项设置：树里没有检测项节点，进去就回不来，所以做成弹窗。
   只放设置，不放运行结果 */
let IDLG=null;
function openItemDlg(k,cam){
  const it=ITEMS[k];
  IDLG={k,cam,scope:it.scope==='all'?(it.imgs?'pick':'all'):null,
        imgs:(it.imgs||scopeImgs(k).map(x=>x.id))};
  renderItemDlg();
}
function renderItemDlg(){
  const k=IDLG.k, it=ITEMS[k], all=it.scope==='all';
  const cams=camsOfItem(k);
  const cid=all?null:((IDLG.cam&&cams.some(c=>c.id===IDLG.cam))?IDLG.cam:(cams[0]||{}).id);
  const c=cid?camOf(cid):null, im=cid?imgOf(k,cid):null, sl=slotOf(k);
  const pick=IDLG.scope==='pick';
  const r=(l,v,u)=>FD(l,v,u);
  const grp=(t,body)=>`${t?`<div class="dgt">${t}</div>`:''}<div class="dform">${body}</div>`;
  const sw=(f,tx)=>`<div class="u-row">
    <span class="sw${it[f]?' on':''}" data-idlg="${f}"></span><span class="swtx">${tx}</span></div>`;

  let body='';
  if(all){
    const rows=scopeImgs(k);
    body=grp('',
      r('名称',`<input class="fi" value="${it.n}">`)+
      r('缺陷类别',`<select class="fi" data-idcls>${allDefectTypes().map(x=>
        `<option${x===it.cls?' selected':''}>${x}</option>`).join('')}</select>`)+
      r('允许数量',`<input class="fi" value="${it.thr}">`)+
      r('判定',sw('jud','参与 OK / NG'))+
      r('统计范围',`<select class="fi" data-idscope>
        <option value="all"${pick?'':' selected'}>整件全部图像</option>
        <option value="pick"${pick?' selected':''}>指定图像</option></select>`))+
      `<div class="dgt">统计图像</div><div class="u-box u-mt2">
      <table class="ltab"><thead><tr>
        ${pick?'<th style="width:52px"></th>':''}
        <th style="width:170px">工位</th><th style="width:110px">相机</th><th>图像</th>
        <th style="width:90px" class="num">${it.cls}</th></tr></thead><tbody>`+
      rows.map(x=>{const cc=camOf(x.cam), n=((SCH[x.id]||{}).out||{})[it.cls];
        const on=IDLG.imgs.includes(x.id);
        return `<tr class="u-click"${pick?` data-idimg="${x.id}"`:''}>
          ${pick?`<td><span class="chk${on?' on':''}">${on?I('check'):''}</span></td>`:''}
          <td class="dim">工位${cc.st} ${stOf(cc).name}</td>
          <td class="dim">${cc.name}</td><td>${x.name}</td>
          <td class="num u-danger"${n?'':''}>${n==null?'—':n}</td></tr>`;}).join('')+
      `<tr style="background:var(--panel)">${pick?'<td></td>':''}<td><b>合计</b></td><td></td>
        <td class="dim">${pick?IDLG.imgs.length:rows.length} 张图像</td>
        <td class="num"><b>${rows.filter(x=>!pick||IDLG.imgs.includes(x.id))
          .reduce((a,x)=>a+(((SCH[x.id]||{}).out||{})[it.cls]||0),0)}</b></td></tr>
      </tbody></table></div>`;
  } else if(it.fam==='尺寸'){
    const is3D=/\(3D\)/.test(it.scheme);
    const manual=it.scale!=null;
    const sv=is3D?1:(manual?it.scale:(c?c.mmpp:0));
    body=grp('',
      r('名称',`<input class="fi" value="${it.n}">`)+
      r('方案',ro(it.scheme))+
      r('比例尺来源',`<select class="fi" data-idscale${is3D?' disabled':''}>
          <option value="cam"${manual&&!is3D?'':' selected'}>跟随相机标定</option>
          ${is3D?'':`<option value="man"${manual?' selected':''}>单独指定</option>`}</select>`)+
      r('比例尺',`<input class="fi" value="${is3D?'1':sv.toFixed(5)}"${(manual&&!is3D)?'':' readonly'}>`,'mm/px')+
      r('标准值',`<input class="fi" value="${fmt(it.std)}">`,'mm')+
      r('上公差',`<input class="fi" value="+${fmt(it.tu)}">`,'mm')+
      r('下公差',`<input class="fi" value="${fmt(it.td)}">`,'mm')+
      r('判定',sw('jud','参与 OK / NG')));
  } else {
    body=grp('',
      r('名称',`<input class="fi" value="${it.n}">`)+
      r('方案',ro(it.scheme))+
      r('比对方式',`<select class="fi"><option${it.mode==='固定内容'?' selected':''}>固定内容</option>
        <option${it.mode==='正则'?' selected':''}>正则</option>
        <option${it.mode==='不比对'?' selected':''}>不比对</option></select>`)+
      r('期望内容',`<input class="fi" value="${it.expect||''}"${it.mode==='不比对'?' disabled':''}>`)+
      r('判定',sw('jud','参与 OK / NG')));
  }

  dlg(dlgShell({size:all?'l':'m',icon:'pencil',title:'编辑检测项',sub:it.n+(c?' · '+c.name:''),body,
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-x>保存</button>'}));
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=()=>{IDLG=null;closeDlg();renderContent();});
  $$('#dlgmask [data-idlg]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.idlg;ITEMS[IDLG.k][f]=ITEMS[IDLG.k][f]?0:1;renderItemDlg();});
  const cl=$('#dlgmask [data-idcls]');
  if(cl)cl.onchange=()=>{ITEMS[IDLG.k].cls=cl.value;
    IDLG.imgs=scopeImgs(IDLG.k).map(x=>x.id);renderItemDlg();};
  const scl=$('#dlgmask [data-idscale]');
  if(scl)scl.onchange=()=>{const it2=ITEMS[IDLG.k];
    it2.scale=scl.value==='man'?(camOf(IDLG.cam||(camsOfItem(IDLG.k)[0]||{}).id)||{}).mmpp:null;
    renderItemDlg();};
  const sc=$('#dlgmask [data-idscope]');
  if(sc)sc.onchange=()=>{IDLG.scope=sc.value;renderItemDlg();};
  $$('#dlgmask [data-idimg]').forEach(tr=>tr.onclick=()=>{
    const id=tr.dataset.idimg, i=IDLG.imgs.indexOf(id);
    if(i<0)IDLG.imgs.push(id); else IDLG.imgs.splice(i,1);
    renderItemDlg();});
  $$('#dlgmask [data-goimg]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.goimg;IDLG=null;closeDlg();S.sel={t:'img',id};renderAll();syncDock();});
}

/* 批量启停 */
function batchToggleDlg(){
  const ks=orderKeys();
  const allOn=f=>ks.every(k=>ITEMS[k][f]);
  dlg(dlgShell({size:'l',icon:'checkbox',title:'批量启停检测项',
    body:`<div class="u-box">
      <table class="ltab"><thead><tr>
        <th style="width:72px"><span class="u-row"><span class="chk${allOn('out')?' on':''}" data-ball="out">${allOn('out')?I('check'):''}</span>输出</span></th>
        <th style="width:72px"><span class="u-row"><span class="chk${allOn('jud')?' on':''}" data-ball="jud">${allOn('jud')?I('check'):''}</span>判定</span></th>
        <th style="width:220px">检测项</th><th style="width:96px">类型</th><th>工位</th>
      </tr></thead><tbody>${ks.map(k=>{const it=ITEMS[k];
        return `<tr><td><span class="chk${it.out?' on':''}" data-bt="out" data-k="${k}">${it.out?I('check'):''}</span></td>
          <td><span class="chk${it.jud?' on':''}" data-bt="jud" data-k="${k}">${it.jud?I('check'):''}</span></td>
          <td>${it.n}</td><td class="dim">${it.fam}</td>
          <td class="dim">${stsOf(k).map(n=>'工位'+n).join(' · ')}</td></tr>`;}).join('')}
      </tbody></table></div>`,
    left:`输出 <b>${ks.filter(k=>ITEMS[k].out).length}</b> 项 · 判定 <b>${ks.filter(k=>ITEMS[k].jud).length}</b> 项`,
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-x>确定</button>'}));
  const rerun=()=>{closeDlg();batchToggleDlg();};
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=()=>{closeDlg();renderContent();});
  $$('#dlgmask [data-bt]').forEach(b=>b.onclick=()=>{
    const it=ITEMS[b.dataset.k], f=b.dataset.bt;it[f]=it[f]?0:1;rerun();});
  $$('#dlgmask [data-ball]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.ball, on=!allOn(f);
    orderKeys().forEach(k=>ITEMS[k][f]=on?1:0);rerun();});
}

function copyItemsDlg(camId){
  const c=camOf(camId||S.sel.id)||CAMS[0];
  const others=CAMS.filter(x=>x.id!==c.id);
  dlg(dlgShell({size:'l',icon:'copy',title:'复制检测项',sub:`${c.name} 全部图像 → 其他相机`,
    body:`<div class="u-box">
      <table class="ltab"><thead><tr><th style="width:52px"><span class="chk" data-cpall></span></th>
        <th style="width:220px">工位</th><th style="width:160px">相机</th><th>图像数</th>
      </tr></thead><tbody>${others.map(x=>`<tr class="u-click" data-cpcam="${x.id}">
          <td><span class="chk"></span></td>
          <td class="dim">工位${x.st} ${stOf(x).name}</td>
          <td>${x.name}</td><td class="dim">${imgsOf(x.id).length}</td></tr>`).join('')}
      </tbody></table></div>`,
    left:'已选 <b id="cpn">0</b> 台相机',
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-ok disabled>复制</button>'}));
  const setC=(k,on)=>{k.classList.toggle('on',on);k.innerHTML=on?'<i class="ti ti-check"></i>':'';};
  const sync=()=>{const n=$$('#dlgmask [data-cpcam] .chk.on').length;$('#cpn').textContent=n;
    $('#dlgmask [data-ok]').disabled=!n;setC($('#dlgmask [data-cpall]'),n&&n===others.length);renderIcons($('#dlgmask'));};
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=closeDlg);
  $('#dlgmask [data-cpall]').onclick=e=>{e.stopPropagation();
    const on=$$('#dlgmask [data-cpcam] .chk.on').length<others.length;
    $$('#dlgmask [data-cpcam] .chk').forEach(k=>setC(k,on));sync();};
  $$('#dlgmask [data-cpcam]').forEach(tr=>tr.onclick=()=>{
    const k=tr.querySelector('.chk');setC(k,!k.classList.contains('on'));sync();});
  $('#dlgmask [data-ok]').onclick=()=>{const n=$$('#dlgmask [data-cpcam] .chk.on').length;closeDlg();toast(`已复制到 ${n} 台相机`);};
}

/* ===== 弹窗 v2 外壳（两产品共用框架件，规范 §13.1）=====
   标题栏：图标 · 「动词 + 对象」 · 关闭（不设副标题，o.sub 不再显示）；内容区是唯一会滚动的部分；
   页脚：左侧放数据或次要操作，右侧 取消 · 主操作（主按钮用标题里的动词）。 */
function dlgShell(o){
  return '<div class="adlg v2'+(o.size&&o.size!=='s'?' '+o.size:'')+(o.fix?' fix':'')+'"'+(o.id?' id="'+o.id+'"':'')+'>'+
    '<div class="ah">'+(o.icon?'<i class="ti ti-'+o.icon+'"></i>':'')+'<span>'+o.title+'</span>'+
      '<i class="ti ti-x x" data-x></i></div>'+
    '<div class="ab">'+o.body+'</div>'+
    '<div class="af">'+(o.left!=null?'<span class="lft">'+o.left+'</span>':'')+o.btns+'</div></div>';
}
/* 确认框的影响范围：[[名称, 数量], …]，是数据不是说明 */
function dlgImp(imp){
  return imp&&imp.length?'<div class="dimph">同时移除</div><div class="dimp">'+
    imp.map(x=>'<div><b>'+x[1]+'</b>'+x[0]+'</div>').join('')+'</div>':'';
}
/* 弹窗表单行：标签 88 在左，控件占满，单位槽恒在（右缘对齐）；req=必填 */
function FD(l,v,u,req){
  return '<div class="drow"><span class="dk'+(req?' req':'')+'">'+l+'</span><span class="dv">'+v+
    '<span class="du">'+(u||'')+'</span></span></div>';
}
/* ===== 弹窗 v2 外壳结束 ===== */
function confirmDlg(title,icon,msg,warn,okText,okCls,onOk,imp){
  dlg(dlgShell({size:'s',icon,title,
    body:`<div class="dmsg">${msg}</div>${dlgImp(imp)}
      ${warn?`<div class="dwarn"><i class="ti ti-alert-triangle"></i><span>${warn}</span></div>`:''}`,
    /* 拦截类（okCls 'sec'，如「无法删除」）只有一个「知道了」，不再配取消 */
    btns:okCls==='sec'?`<button class="abtn pri" data-ok>${okText||'知道了'}</button>`
      :`<button class="abtn sec" data-x>取消</button>
      ${warn&&!okText?'':`<button class="abtn ${okCls||'pri'}" data-ok>${okText||'确定'}</button>`}`}));
  $$('#dlgmask [data-x]').forEach(b=>b.onclick=closeDlg);
  const ok=$('#dlgmask [data-ok]'); if(ok)ok.onclick=()=>{onOk();closeDlg();renderAll();};
}

const F=(l,v)=>`<div class="frow"><span class="flabel">${l}</span><span class="fval">${v}</span></div>`;


/* 批量生成图像：MQ / 飞拍动辄上百张，必须能一次生成并按规律填参数 */

  else if(t==='dev'){obj=DEVS[S.sel.id];label='设备';}

  else if(t==='el'){obj=ELS[S.sel.id];label='元素';}
  else if(t==='item'){obj=ITEMS[S.sel.id];label='检测项';}
  if(!obj)return;
  const cur=obj.name||obj.n;
  dlg(dlgShell({size:'s',icon:'pencil',title:'重命名'+label,sub:cur,
    body:'<div class="dform">'+FD('名称',`<input class="fi" id="rn" value="${cur}">`,'',1)+'</div>',
    btns:'<button class="abtn sec" data-x>取消</button><button class="abtn pri" data-ok>重命名</button>'}));

/* --- 删除（带引用完整性检查） --- */
function delElement(){
  const t=S.sel.t;
  /* §88 图像自定义节点。（原先前面还有一个被覆盖的同名死函数，2026-09-23 已删） */
  if(t==='sig'){
    const r=sigById(S.sel.id); if(!r)return;
    return confirmDlg('删除节点','trash',`确认删除 <b>${r.g.n}</b>？`,
      `${SEGN[r.seg]} · ${r.g.k==='fx'?r.g.tool:r.g.k==='delay'?('延时 '+(r.g.dly||0)+' ms'):tgtFull(r.g.tgt)}`,
      '删除','dgr',()=>{
      const a=sigsOf(r.im,r.seg), i=a.indexOf(r.g); if(i>=0)a.splice(i,1);
      S.sel={t:'img',id:r.im.id};});
  }
  if(t==='loc'){
    const r=locById(S.sel.id); if(!r)return;
    const {l:L,im}=r, ls=locsOf(im), i=ls.indexOf(L);
    const users=im.els.filter(e=>ELS[e].ref===L.id).length
      + schsOf(im).filter(sh=>((schInfo(sh.id)||{}).sc||{}).ref===L.id).length;
    return confirmDlg('删除定位','trash',
      `确认删除 <b>${L.m}</b>？`,
      users?`有 ${users} 个元素或方案引用它的坐标系，删除后落回图像坐标系`
        :(i===0&&ls.length>1?'它是默认坐标系，删除后下一个定位成为默认':''),
      '删除','dgr',()=>{
        ls.splice(i,1);
        im.els.forEach(e=>{if(ELS[e].ref===L.id)ELS[e].ref='';});
        schsOf(im).forEach(sh=>{const sc=(schInfo(sh.id)||{}).sc;if(sc&&sc.ref===L.id)sc.ref='';});
        S.sel={t:'img',id:im.id};});
  }
  if(t==='st'){
    const st=STATIONS.find(x=>x.no==S.sel.id),cams=CAMS.filter(c=>c.st==S.sel.id);
    if(cams.length)return confirmDlg('无法删除工位','alert-triangle',
      `工位 <b>${st.name}</b> 下还选用着 ${cams.length} 台相机。`,
      `请先移除：${cams.map(c=>c.name).join('、')}。设备本身不会被删除。`,'知道了','sec',()=>{});
    return confirmDlg('删除工位','trash',`确认删除工位 <b>${st.name}</b>？`,'','删除','dgr',()=>{
      STATIONS.splice(STATIONS.indexOf(st),1);renumberStations();S.sel={t:'flow'};});}   /* 删除后流程顺序连续 */
  if(t==='cam'){
    const c=camOf(S.sel.id),imgs=IMGS.filter(x=>x.cam===c.id);
    if(imgs.length)return confirmDlg('无法删除相机','alert-triangle',
      `相机 <b>${c.name}</b> 下还有 ${imgs.length} 张图像。`,
      `请先在「检测编辑」里删除这些图像：${imgs.map(x=>'图'+x.no+' '+x.name).join('、')}`,'知道了','sec',()=>{});
    return confirmDlg('移除相机','trash',
      `确认把 <b>${c.name}</b> 从 <b>工位${c.st} ${stOf(c).name}</b> 移除？`,
      '只解除本工位对这台设备的选用，设备本身保留在设备列表里。',
      '移除','dgr',()=>{
        CAMS.splice(CAMS.indexOf(c),1);
        S.sel={t:'cam',id:CAMS[0]?CAMS[0].id:''};});}
  if(t==='lc'){
    const o=LCTRL.find(x=>x.id===S.sel.id), n=LIGHTS.length;
    if(LCTRL.length<2)return confirmDlg('无法删除控制器','alert-triangle',
      '至少保留一台光源控制器。','','知道了','sec',()=>{});
    return confirmDlg('删除控制器','trash',`确认删除 <b>${o.model}</b>？`,
      '','删除','dgr',()=>{
        LCTRL.splice(LCTRL.indexOf(o),1);S.sel={t:'lc',id:LCTRL[0].id};},[['路光源',n]]);}
  if(t==='io'){
    const o=IOCARDS.find(x=>x.id===S.sel.id);
    if(IOCARDS.length<2)return confirmDlg('无法删除 IO 卡','alert-triangle',
      '至少保留一块 IO 卡。','','知道了','sec',()=>{});
    return confirmDlg('删除 IO 卡','trash',`确认删除 <b>${o.model}</b>？`,'','删除','dgr',()=>{
      IOCARDS.splice(IOCARDS.indexOf(o),1);S.sel={t:'io',id:IOCARDS[0].id};});}
  if(t==='plc'){
    const o=PLCS.find(x=>x.id===S.sel.id);
    return confirmDlg('删除 PLC','trash',`确认删除 <b>${o.model}</b>？`,'','删除','dgr',()=>{
      PLCS.splice(PLCS.indexOf(o),1);S.sel=PLCS[0]?{t:'plc',id:PLCS[0].id}:{t:'dev',id:Object.keys(DEVS)[0]};});}
  if(t==='dev'){
    const dev=S.sel.id, used=camsOfDev(dev);
    if(used.length)return confirmDlg('无法删除设备','alert-triangle',
      `设备 <b>${DEVS[dev].n}</b> 正被 ${used.length} 个工位选用。`,
      `请先在这些工位移除它：${used.map(x=>'工位'+x.st+' '+stOf(x).name).join('、')}`,'知道了','sec',()=>{});
    return confirmDlg('删除设备','trash',`确认删除 <b>${DEVS[dev].n}</b>？`,'','删除','dgr',()=>{
      delete DEVS[dev];S.sel={t:'dev',id:Object.keys(DEVS)[0]||''};});}
  if(t==='img'){
    const im=IMGS.find(x=>x.id===S.sel.id);
    const n=im.els.length+im.items.length;
    return confirmDlg('删除图像','trash',
      `确认删除 <b>图${im.no} ${im.name}</b>？`,'',
      '删除','dgr',()=>{
        im.els.forEach(e=>delete ELS[e]);im.items.forEach(k=>delete ITEMS[k]);
        IMGS.splice(IMGS.indexOf(im),1);
        S.sel=IMGS.length?{t:'img',id:IMGS[0].id}:{t:'list'};},n?[['元素',im.els.length],['检测项',im.items.length]]:null);}
  if(t==='el'){
    const e=S.sel.id,rf=refsOf(e);
    if(rf.length)return confirmDlg('无法删除元素','alert-triangle',
      `元素 <b>${ELS[e].n}</b> 正被 ${rf.length} 个检测项引用。`,
      `请先解除引用：${rf.map(k=>ITEMS[k].n).join('、')}`,'知道了','sec',()=>{});
    return confirmDlg('删除元素','trash',`确认删除 <b>${ELS[e].n}</b>？`,'','删除','dgr',()=>{
      const im=imgOfEl(e);im.els.splice(im.els.indexOf(e),1);delete ELS[e];
      S.sel={t:'img',id:im.id};});}
  if(t==='item'){
    const k=S.sel.id;
    return confirmDlg('删除检测项','trash',`确认删除 <b>${ITEMS[k].n}</b>？`,'','删除','dgr',()=>{
      const im=imgOf(k);im.items.splice(im.items.indexOf(k),1);delete ITEMS[k];
      S.sel={t:'img',id:im.id};});}
  confirmDlg('无法删除','alert-triangle','当前选中项不支持删除。','','知道了','sec',()=>{});
}

/* --- 复制 --- */
function copyNode(){
  const t=S.sel.t;
  if(t==='dev'){const src=DEVS[S.sel.id],dev=newDevId();
    DEVS[dev]={...src,n:src.n+' 副本',ip:String(src.ip).replace(/\d+$/,m=>+m+10)};
    S.sel={t:'dev',id:dev};renderAll();return;}
  if(t==='img'){const im=IMGS.find(x=>x.id===S.sel.id),id=newImgId();
    const nels=[],nitems=[];
    im.els.forEach(e=>{const ne=newElId();ELS[ne]={...ELS[e]};nels.push(ne);});
    im.items.forEach(k=>{const nk=newItemId();ITEMS[nk]={...ITEMS[k]};nitems.push(nk);});
    IMGS.push({...im,id,no:IMGS.filter(x=>x.cam===im.cam).length+1,
      name:im.name+' 副本',els:nels,items:nitems});
    S.sel={t:'img',id};renderAll();return;}
  confirmDlg('无法复制','alert-triangle','当前选中项不支持复制。','','知道了','sec',()=>{});
}

/* ---------- 检测项定位到所在图像（用户 2026-10-14：检测清单、缺陷明细、调试 / 生产输出的右键菜单）----------
   跳到检测配置的该图像，并选中输出这个检测项的方案节点；生产中不离开生产页。 */
function itemImgs(k){const it=ITEMS[k]; if(!it)return [];
  return it.scope==='all'?scopeImgs(k):camsOfItem(k).map(c=>imgOf(k,c.id)).filter(Boolean);}
function gotoImg(imId,sel){
  if(PRODMODE&&DBG.running)return toast('正在生产，先停止再定位');
  if(railOf(S.rail)!=='mach')$('.railbtn[data-rail="mach"]').click();
  goLv(2,imId); if(sel){S.sel=sel;S.ptool=false;renderAll();syncDock();}

/* 一个检测项可能出在多张图上（多相机、AI 汇总项），菜单逐张列出 */
function itemLocMenu(k){

  CTXFN=ims.map(im=>[im,()=>gotoImg(im.id,{t:'sch',id:it.scope==='all'?'ai:'+im.id:'it:'+k+'@'+im.cam})]);
  return ims.length?ims.map((im,i)=>[`定位到 ${imgPath(im)}`,'target','FN:'+i]):[['没有图像输出此检测项','target','','dis']];
}

/* --- 快捷键：执行三键的键盘入口 --- */
const anyMask=()=>['#dlgmask','#tmask','#rvmask','#bsmask']
  .some(q=>{const m=$(q);return m&&m.classList.contains('on');});
document.addEventListener('keydown',e=>{
  const tg=e.target, tag=tg&&tg.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable);
  if(e.key==='Escape'){
    if($('#hmimask').classList.contains('on')&&!anyMask()){
      if(HPLACE){HPLACE=null;renderHmi();}
      else if(HSEL.length){HSEL=[];renderHmi();}
      return;}
    if(anyMask()){closeDlg();['#tmask','#rvmask','#bsmask']
      .forEach(q=>{const m=$(q);if(m)m.classList.remove('on');});return;}
    if($('#ctx').classList.contains('on')){$('#ctx').classList.remove('on');return;}
    e.preventDefault();if(S.rail==='mach'){if(CAP.run)capStop(); if(MRUN.run)mrunStop();return;}dbgStop();return;}
  if(typing||anyMask()||PRODMODE)return;
  if($('#hmimask').classList.contains('on')){
    if(e.key==='Delete'){const s=hsel();
      if(s.length){hpg().els=hpg().els.filter(x=>!s.includes(x));HSEL=[];renderHmi();}}
    return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();doSave();return;}
  if(e.key==='F5'){e.preventDefault();
    if(e.ctrlKey||e.metaKey)dbgRun('loop');else dbgRun('once',S.rail==='insp'?'tree':undefined);return;}
  if(e.key==='F2'&&S.rail){const c=cap();if(c&&c.ren)renameDlg();return;}
  if(e.key==='Delete'){const c=cap();if(c&&c.del)delElement();}
});

function vdAct(a){
  const k=VD.kind, R=vdRows(), i=VD.ri, L=vdList(), o=L&&L[VD.li];
  const item=()=>k==='gv'?{n:vdUniq('缓存值',R),g:'',t:'数字',dv:'0',cur:'',p:0}
    :k==='dq'?{n:vdUniq('数据',R),t:'数字',rows:1,cur:0}
    :{k:'f'+Date.now().toString(36)+R.length,n:vdUniq('项目',R),t:'数字',p:0,pend:1};
  const re=()=>{vdFixSel();vdPaint();};
  switch(a){
    case 'add':R.push(item());VD.ri=R.length-1;return re();
    case 'copy':{const c=JSON.parse(JSON.stringify(R[i]));c.n=vdUniq(R[i].n+'_',R);
      if(k==='dd'){c.k='f'+Date.now().toString(36)+R.length;c.pend=1;}
      R.splice(i+1,0,c);VD.ri=i+1;return re();}
    case 'del':R.splice(i,1);return re();
    case 'up':[R[i-1],R[i]]=[R[i],R[i-1]];VD.ri=i-1;return re();
    case 'down':[R[i+1],R[i]]=[R[i],R[i+1]];VD.ri=i+1;return re();
    case 'imp':return toast('导入：原型占位');
    case 'exp':return toast('导出：原型占位');
    case 'ladd':L.push(k==='dq'?{n:vdUniq('缓存列',L),clr:0,f:[]}:{n:vdUniq('缓存表',L),cap:-1,f:[],rec:{}});
      VD.li=L.length-1;VD.ri=-1;return re();
    case 'lcopy':{const c=JSON.parse(JSON.stringify(o));c.n=vdUniq(o.n+'_',L);
      if(k==='dq')c.f.forEach(f=>f.cur=0);else{c.rec={};c.f.forEach(f=>f.pend=1);}
      L.splice(VD.li+1,0,c);VD.li++;return re();}
    case 'ldel':L.splice(VD.li,1);VD.ri=0;return re();
    case 'limp':return toast('全部导入：原型占位');
    case 'lexp':return toast('全部导出：原型占位');
    case 'lclr':return vdConfirm(k==='dq'?'清空缓存列数据':'清空缓存表数据',
      `确认清空全部 ${L.length} 个${k==='dq'?'缓存列的数据':'缓存表的记录'}？`,'清空',
      ()=>L.forEach(x=>k==='dq'?x.f.forEach(f=>f.cur=0):x.rec={}));
    case 'reset':R.forEach(x=>x.cur=x.dv);re();return toast('当前值已恢复为默认值，保存后生效');
    case 'qclr':return vdConfirm('清空缓存列数据',`确认清空 ${o.n} 的数据？`,'清空',()=>o.f.forEach(f=>f.cur=0));
    case 'radd':{let n=1;while(o.rec['记录'+n])n++;const id='记录'+n;o.rec[id]={};VD.id=id;return re();}
    case 'rdel':return vdConfirm('删除记录',`确认删除记录 ${vdEsc(VD.id)}？`,'删除',()=>{delete o.rec[VD.id];VD.id=null;});
    case 'rclr':return vdConfirm('清空缓存表记录',`确认清空 ${vdEsc(o.n)} 的全部 ${Object.keys(o.rec).length} 条记录？`,'清空',()=>{o.rec={};VD.id=null;});
  }
}

   rail 本身一直都在，不需要多学一套「编辑/生产」开关 */
function applyRailMode(){
  const prod=S.rail==='prod';
  const entering=prod&&!PRODMODE;   /* 只在「刚切进生产」这一次为真 */
  PRODMODE=prod;
  /* 顶部只剩导航条，不再随页面变化，原来 dev/mach/proj 专用的 .quiet 收边框处理
     整个没有存在的必要了——ribbon 那条横条已经拆掉，不会再有任何页面在顶部露出
     一条空的工具条，这个问题是从根上消失的，不是靠视觉遮掩解决的 */
  /* 「连跑不带进生产」这条只该在切进生产的那一瞬间生效。原来写的是 prod && ...，
     而 applyRailMode 每次 renderAll 都走一遍，于是在生产页里只要一 renderAll 就把 DBG.running 清零——
     以前右上角那几个键不在生产态出现，没人碰得到，这个 bug 就一直躺着；
     现在「开始生产」就在生产页上，点了立刻被下一次 renderAll 清掉，等于按不动。
     改成只在 entering 时清。 */
  if(entering){
    /* §88 调试期的会话状态不该活到生产里。三件事一起收，但只出一条提示——
       toast 是单例，连发两条只会看到最后一条。 */
    const back=[];
    if(DBG.mode==='offline'){DBG.mode='online';back.push('自动切回实时图像');}
    DBG.running=null;
    if(DBG.noExt){DBG.noExt=false;back.push('已恢复写出');applyDockH();}
    if(back.length)toast('已切生产，'+back.join(' · '));}
  $('#main').classList.toggle('hide',prod);
  $('#prodbody').classList.toggle('hide',!prod);
  $$('#tabbar .rtab').forEach(t=>t.style.display=prod?'none':'');
  $('#rgroups').style.display=prod?'none':'flex';
  /* 生产页的 renderAll 会提前 return，到不了 renderTbDispatch 里清 #rextra 的那一句，
     检测编辑的执行组（执行选项 / 停止 / 全流程执行 / 执行图像）会残留在生产页顶部，这里切进生产时就清掉 */
  if(prod){const rxp=$('#rextra');if(rxp)rxp.innerHTML='';}
  $('#prodhead').style.display=prod?'flex':'none';
  /* 编辑画面已挪到左栏底部（设置上方），不在 #prodhead 里了，显隐要单独跟着生产态走 */
  $('#prod-editscene').style.display=prod?'flex':'none';
  /* 生产页不给保存（操作员不存工程）。原来用 visibility 藏，元素还占着位子，
     左栏顶上就空出一个方框加一条线；改成 display 收掉，分割线一起收。 */
  $('#btn-save').style.display=prod?'none':'flex';
  renderSaveState();renderRunStatus();
  /* 顶栏只在「这一页确实有东西可放」时出现——生产页有生产按钮，
     检测编辑/输出设置有各自的工具，工程管理/设备配置/机台结构什么都没有，那就整条不要。 */
  renderTbBar();   /* 必须在这里，不能只在 renderTbDispatch 里——生产页 renderAll() 会提前 return */
  const hasTop = prod || (S.rail==='insp'||S.rail==='out'||S.rail==='mach');
  $('#navbar').classList.toggle('hide',!hasTop);
  /* 权限是按角色定义的（系统设置·用户与权限里三种：操作员/工程师/管理员），
     所以这里显示的是角色不是人名——「王工」这种写法看不出他能改什么。
     状态栏和左下角这两处说的是同一件事，同一个来源，同时改。 */
  const role=prod?'操作员':'工程师';

  const w=s.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  s.title=o&&cv.measureText(o.text).width>w?o.text:s.dataset.t0;},true);})();

/* 文本框按内容定档（规范 §7：短数值 120、常规 180、长文本 320，禁止拉满一行；属性栏除外）。
   用户 2026-10-13：弹窗、内容区表单与表格里的控件过长。渲染后统一归档，含输入框的表格按内容收窄 */
(function(){
  const SCOPE='#dlgmask .fi, #cbody .fi, .fval .fi, .bsrow .fi, #proppane.stedit .fi';
  const unitAfter=e=>{const n=e.nextElementSibling;return !!n&&/^(SPAN)$/.test(n.tagName)&&/\b(unit|du|un)\b/.test(n.className);};
  const tier=e=>{
    if(e.tagName==='SELECT'){const L=Math.max(0,...[...e.options].map(o=>o.text.length));return L>12?'w-l':'w-m';}
    if(e.tagName==='TEXTAREA')return '';
    const v=String(e.value||e.getAttribute('placeholder')||'');
    if(e.type==='number'||e.classList.contains('addr')||e.classList.contains('num')||'cgf' in e.dataset||unitAfter(e)||/^-?[\d.,:]+$/.test(v))return 'w-s';
    if(v.length>12||/[\/\\{}]/.test(v))return 'w-l';
    return 'w-m';};
  function fitFields(){
    document.querySelectorAll(SCOPE).forEach(e=>{
      if(e.closest('#propbody')&&!e.closest('#proppane.stedit'))return;   /* 窄属性栏控件占满标签右侧（规范例外） */
      const t=tier(e);e.classList.remove('w-s','w-m','w-l');if(t)e.classList.add(t);
      const tb=e.closest('table.ltab');if(tb){tb.classList.add('fit');const w=tb.parentElement;if(w&&w.children.length===1&&w!==document.body&&!w.matches('#cbody,.ctw,.psb,td'))w.classList.add('fitbox');}});
  }
  let q=0;const run=()=>{q=0;fitFields();};
  new MutationObserver(()=>{if(!q)q=requestAnimationFrame(run);}).observe(document.body,{childList:true,subtree:true});
  window.fitFields=fitFields;
})();
</script>
</body>
